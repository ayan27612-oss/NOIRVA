<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070707">
<title>NOIRVA — Virtual Casino</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:#050505;
  color:#f5f5f5;
  font-family:Arial,Helvetica,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}

.app{
  width:100%;
  max-width:760px;
  min-height:100vh;
  margin:auto;
  background:#0a0a0a;
  overflow:hidden;
}

.header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #202020;
  background:rgba(10,10,10,.94);
  backdrop-filter:blur(16px);
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:20px;
  font-weight:700;
  letter-spacing:5px;
}

.demo{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:8px;
  letter-spacing:2px;
  color:#666;
  white-space:nowrap;
}

.balance{
  border:1px solid #292929;
  background:#111;
  border-radius:30px;
  padding:8px 12px;
  min-width:100px;
  text-align:center;
}
.balance small{
  color:#666;
  font-size:8px;
  letter-spacing:1px;
}
.balance strong{
  display:block;
  margin-top:2px;
  font-size:13px;
}

.hero{
  padding:30px 18px 18px;
  text-align:center;
}
.kicker{
  color:#666;
  font-size:9px;
  letter-spacing:4px;
  margin-bottom:9px;
}
.hero h1{
  margin:0;
  font-size:38px;
  letter-spacing:-1px;
}
.hero p{
  color:#777;
  font-size:12px;
  margin:9px 0 0;
}

.game{
  padding:0 12px 35px;
}

.wheel-area{
  position:relative;
  display:flex;
  justify-content:center;
  padding:12px 0 18px;
}

.pointer{
  position:absolute;
  z-index:5;
  top:5px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:9px solid transparent;
  border-right:9px solid transparent;
  border-top:20px solid #fff;
  filter:drop-shadow(0 2px 5px #000);
}

.wheel{
  width:min(72vw,300px);
  height:min(72vw,300px);
  max-width:300px;
  max-height:300px;
  border-radius:50%;
  border:9px solid #272727;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
  repeating-conic-gradient(
    from -7.5deg,
    #161616 0deg 9.73deg,
    #7b1717 9.73deg 19.46deg
  );
  box-shadow:
    0 0 0 2px #454545,
    0 18px 55px rgba(0,0,0,.6),
    inset 0 0 35px rgba(255,255,255,.05);
  transition:transform 3.8s cubic-bezier(.08,.75,.12,1);
}

.wheel:before{
  content:"";
  width:62%;
  height:62%;
  border-radius:50%;
  border:2px solid #777;
  background:
    radial-gradient(circle,#191919 0 31%,#0b0b0b 32% 55%,#171717 56% 57%,#0a0a0a 58%);
  position:absolute;
}

.wheel:after{
  content:"NOIRVA";
  position:absolute;
  width:62px;
  height:62px;
  border-radius:50%;
  background:#080808;
  border:1px solid #555;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:8px;
  letter-spacing:2px;
  font-weight:700;
}

.number-ring{
  position:absolute;
  inset:0;
  z-index:2;
}

.number{
  position:absolute;
  left:50%;
  top:50%;
  width:25px;
  height:25px;
  margin:-12.5px;
  text-align:center;
  font-size:9px;
  font-weight:700;
  line-height:25px;
  transform-origin:12.5px 12.5px;
  color:#fff;
}

.result{
  text-align:center;
  min-height:64px;
  padding:4px 0 12px;
}
.result-number{
  font-size:30px;
  font-weight:700;
  transition:transform .25s,opacity .25s;
}
.result-color{
  font-size:9px;
  letter-spacing:3px;
  color:#777;
  margin-top:3px;
}

.bet-summary{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid #242424;
  background:#101010;
  border-radius:9px;
  padding:12px 13px;
  margin-bottom:12px;
}
.bet-summary span{
  color:#666;
  font-size:9px;
  letter-spacing:1px;
}
.bet-summary strong{
  font-size:13px;
}

.section-title{
  color:#666;
  font-size:9px;
  letter-spacing:2px;
  margin:18px 2px 8px;
  text-transform:uppercase;
}

.color-bets{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
}
.color-btn{
  height:45px;
  border:1px solid #303030;
  background:#141414;
  color:#ddd;
  border-radius:7px;
  cursor:pointer;
  font-size:10px;
  letter-spacing:1px;
  transition:.18s ease;
}
.color-btn.red.active{
  background:#641616;
  border-color:#a63a3a;
}
.color-btn.black.active{
  background:#303030;
  border-color:#777;
}
.color-btn.green.active{
  background:#123d2b;
  border-color:#2e7655;
}
.color-btn:active{transform:scale(.96)}

.number-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:4px;
}
.number-btn{
  height:38px;
  border:1px solid #292929;
  border-radius:5px;
  color:#eee;
  font-size:11px;
  cursor:pointer;
  transition:.15s ease;
}
.number-btn.red{background:#511515}
.number-btn.black{background:#171717}
.number-btn.green{
  background:#10402c;
  grid-column:span 6;
}
.number-btn.active{
  box-shadow:inset 0 0 0 2px #fff;
  transform:translateY(-1px);
}
.number-btn:active{transform:scale(.94)}

.chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:3px 1px 7px;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}

.chip{
  flex:0 0 auto;
  width:50px;
  height:50px;
  border-radius:50%;
  border:1px solid #555;
  background:#171717;
  color:#fff;
  cursor:pointer;
  font-size:10px;
  transition:.18s ease;
}
.chip.active{
  background:#fff;
  color:#000;
  border-color:#fff;
  transform:translateY(-2px);
}
.chip:active{transform:scale(.92)}

.spin{
  width:100%;
  height:56px;
  border:0;
  border-radius:8px;
  margin-top:15px;
  background:#f4f4f4;
  color:#050505;
  font-weight:700;
  font-size:12px;
  letter-spacing:2px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:.2s ease;
}
.spin:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(110deg,transparent,rgba(255,255,255,.5),transparent);
  transform:translateX(-100%);
}
.spin:hover:before{animation:shine .8s ease}
.spin:active{transform:scale(.985)}
.spin:disabled{
  opacity:.45;
  cursor:not-allowed;
}

@keyframes shine{
  to{transform:translateX(100%)}
}

.message{
  text-align:center;
  min-height:35px;
  padding-top:11px;
  font-size:11px;
  color:#777;
  letter-spacing:.4px;
}

.message.win{
  color:#ddd;
  animation:winPulse .55s ease;
}
.message.loss{
  color:#777;
  animation:lossShake .3s ease;
}

@keyframes winPulse{
  0%{transform:scale(.9);opacity:.2}
  60%{transform:scale(1.08);opacity:1}
  100%{transform:scale(1)}
}
@keyframes lossShake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-4px)}
  75%{transform:translateX(4px)}
}

.panel{
  border-top:1px solid #202020;
  margin-top:18px;
  padding:20px 2px 0;
}

.panel-title{
  font-size:10px;
  letter-spacing:2px;
  color:#777;
  margin-bottom:12px;
}

.history{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
}
.history::-webkit-scrollbar{display:none}
.history-item{
  flex:0 0 38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
  border:1px solid #333;
}
.history-item.red{background:#511515}
.history-item.black{background:#151515}
.history-item.green{background:#10402c}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:12px;
}
.stat{
  background:#101010;
  border:1px solid #222;
  border-radius:7px;
  padding:12px 8px;
  text-align:center;
}
.stat small{
  display:block;
  color:#666;
  font-size:8px;
  letter-spacing:1px;
}
.stat strong{
  display:block;
  margin-top:5px;
  font-size:15px;
}

.footer{
  border-top:1px solid #202020;
  padding:24px 18px 35px;
  text-align:center;
  color:#444;
  font-size:8px;
  letter-spacing:1.5px;
  line-height:1.8;
}

.particle{
  position:fixed;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#fff;
  pointer-events:none;
  z-index:100;
  animation:particle 850ms ease-out forwards;
}
@keyframes particle{
  from{transform:translate(0,0) scale(1);opacity:1}
  to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}
}

.balance-pop{
  animation:balancePop .45s ease;
}
@keyframes balancePop{
  0%{transform:scale(1)}
  50%{transform:scale(1.08)}
  100%{transform:scale(1)}
}

@media(min-width:700px){
  body{padding:20px}
  .app{
    border:1px solid #252525;
    border-radius:14px;
  }
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">NOIRVA</div>
  <div class="demo">DEMO • VIRTUAL COINS</div>
  <div class="balance" id="balanceBox">
    <small>BALANCE</small>
    <strong id="balance">10,000</strong>
  </div>
</header>

<section class="hero">
  <div class="kicker">NOIRVA CASINO</div>
  <h1>ROULETTE</h1>
  <p>Virtual currency simulation</p>
</section>

<main class="game">

  <div class="wheel-area">
    <div class="pointer"></div>

    <div class="wheel" id="wheel">
      <div class="number-ring" id="numberRing"></div>
    </div>
  </div>

  <div class="result">
    <div class="result-number" id="resultNumber">—</div>
    <div class="result-color" id="resultColor">PLACE YOUR BET</div>
  </div>

  <div class="bet-summary">
    <span>CURRENT BET</span>
    <strong id="currentBet">RED • 250</strong>
  </div>

  <div class="section-title">Colour</div>

  <div class="color-bets">
    <button class="color-btn red active" data-color="red">RED ×2</button>
    <button class="color-btn black" data-color="black">BLACK ×2</button>
    <button class="color-btn green" data-color="green">GREEN ×14</button>
  </div>

  <div class="section-title">Number</div>

  <div class="number-grid" id="numberGrid"></div>

  <div class="section-title">Chip</div>

  <div class="chips">
    <button class="chip" data-chip="100">100</button>
    <button class="chip active" data-chip="250">250</button>
    <button class="chip" data-chip="500">500</button>
    <button class="chip" data-chip="1000">1K</button>
    <button class="chip" data-chip="2500">2.5K</button>
  </div>

  <button class="spin" id="spin">SPIN</button>

  <div class="message" id="message"></div>

  <section class="panel">
    <div class="panel-title">RECENT RESULTS</div>
    <div class="history" id="history"></div>

    <div class="stats">
      <div class="stat">
        <small>RED</small>
        <strong id="redCount">0</strong>
      </div>
      <div class="stat">
        <small>BLACK</small>
        <strong id="blackCount">0</strong>
      </div>
      <div class="stat">
        <small>GREEN</small>
        <strong id="greenCount">0</strong>
      </div>
    </div>
  </section>

</main>

<footer class="footer">
  NOIRVA • DEMO MODE<br>
  VIRTUAL COINS ONLY • NO REAL-MONEY WAGERING
</footer>

</div>

<script>
const wheel=document.getElementById("wheel");
const numberRing=document.getElementById("numberRing");
const numberGrid=document.getElementById("numberGrid");
const balanceEl=document.getElementById("balance");
const balanceBox=document.getElementById("balanceBox");
const resultNumber=document.getElementById("resultNumber");
const resultColor=document.getElementById("resultColor");
const currentBet=document.getElementById("currentBet");
const message=document.getElementById("message");
const spinBtn=document.getElementById("spin");
const historyEl=document.getElementById("history");

let balance=10000;
let selectedColor="red";
let selectedNumber=null;
let selectedChip=250;
let rotation=0;

let history=[];
let stats={
  red:0,
  black:0,
  green:0
};

const reds=[
  1,3,5,7,9,12,14,16,18,
  19,21,23,25,27,30,32,34,36
];

function getColor(n){
  if(n===0)return "green";
  return reds.includes(n)?"red":"black";
}

function format(n){
  return n.toLocaleString("en-IN");
}

function updateBalance(){
  balanceEl.textContent=format(balance);
  balanceBox.classList.remove("balance-pop");
  void balanceBox.offsetWidth;
  balanceBox.classList.add("balance-pop");
}

function updateBet(){
  if(selectedNumber!==null){
    currentBet.textContent="NUMBER "+selectedNumber+" • "+format(selectedChip);
  }else{
    currentBet.textContent=selectedColor.toUpperCase()+" • "+format(selectedChip);
  }
}

function buildWheelNumbers(){
  const total=37;

  for(let i=0;i<total;i++){
    const n=i;
    const el=document.createElement("div");
    el.className="number";
    el.textContent=n;

    const angle=(i/total)*360-90;
    const radius=112;

    const x=Math.cos(angle*Math.PI/180)*radius;
    const y=Math.sin(angle*Math.PI/180)*radius;

    el.style.transform=
      "translate("+x+"px,"+y+"px)";

    el.style.color=
      getColor(n)==="red"
      ?" #ffb0b0"
      :getColor(n)==="green"
      ?" #9ed8b9"
      :"#ddd";

    numberRing.appendChild(el);
  }
}

function buildNumberGrid(){
  numberGrid.innerHTML="";

  const zero=document.createElement("button");
  zero.className="number-btn green";
  zero.textContent="0";
  zero.dataset.number="0";
  numberGrid.appendChild(zero);

  for(let n=1;n<=36;n++){
    const btn=document.createElement("button");
    btn.className="number-btn "+getColor(n);
    btn.textContent=n;
    btn.dataset.number=n;
    numberGrid.appendChild(btn);
  }

  document.querySelectorAll(".number-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".number-btn")
        .forEach(x=>x.classList.remove("active"));

      btn.classList.add("active");
      selectedNumber=Number(btn.dataset.number);
      selectedColor=getColor(selectedNumber);

      document.querySelectorAll(".color-btn")
        .forEach(x=>x.classList.remove("active"));

      document
        .querySelector('.color-btn[data-color="'+selectedColor+'"]')
        .classList.add("active");

      updateBet();
    });
  });
}

document.querySelectorAll(".color-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".color-btn")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    selectedColor=btn.dataset.color;
    selectedNumber=null;

    document.querySelectorAll(".number-btn")
      .forEach(x=>x.classList.remove("active"));

    updateBet();
  });
});

document.querySelectorAll(".chip").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".chip")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    selectedChip=Number(btn.dataset.chip);
    updateBet();
  });
});

function sound(type){
  try{
    const AudioContext=
      window.AudioContext||window.webkitAudioContext;

    if(!AudioContext)return;

    const ctx=new AudioContext();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    let freq=type==="spin"
      ?180
      :type==="win"
      ?620
      :type==="loss"
      ?130
      :type==="tick"
      ?300
      :240;

    osc.frequency.value=freq;
    osc.type=type==="win"?"sine":"triangle";

    gain.gain.setValueAtTime(.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      type==="win"?.08:.035,
      ctx.currentTime+.015
    );
    gain.gain.exponentialRampToValueAtTime(
      .0001,
      ctx.currentTime+(type==="spin"?.16:.11)
    );

    osc.start();
    osc.stop(ctx.currentTime+(type==="spin"?.18:.13));
  }catch(e){}
}

function particles(){
  for(let i=0;i<18;i++){
    const p=document.createElement("div");
    p.className="particle";

    p.style.left="50%";
    p.style.top="45%";

    p.style.setProperty(
      "--x",
      (Math.random()*260-130)+"px"
    );

    p.style.setProperty(
      "--y",
      (Math.random()*220-160)+"px"
    );

    document.body.appendChild(p);

    setTimeout(()=>p.remove(),900);
  }
}

function animateBalance(from,to,duration=500){
  const start=performance.now();

  function frame(now){
    const progress=Math.min(
      1,
      (now-start)/duration
    );

    const value=Math.round(
      from+(to-from)*progress
    );

    balanceEl.textContent=format(value);

    if(progress<1){
      requestAnimationFrame(frame);
    }
  }

  requestAnimationFrame(frame);
}

function addHistory(number,color){
  history.unshift({number,color});
  history=history.slice(0,12);

  historyEl.innerHTML="";

  history.forEach(item=>{
    const el=document.createElement("div");
    el.className="history-item "+item.color;
    el.textContent=item.number;
    historyEl.appendChild(el);
  });

  stats[color]++;
  document.getElementById("redCount").textContent=stats.red;
  document.getElementById("blackCount").textContent=stats.black;
  document.getElementById("greenCount").textContent=stats.green;
}

function spin(){

  if(spinBtn.disabled)return;

  if(selectedChip>balance){
    message.textContent="Not enough virtual coins.";
    message.className="message loss";
    sound("loss");
    return;
  }

  const previousBalance=balance;

  balance-=selectedChip;
  updateBalance();

  spinBtn.disabled=true;
  message.className="message";
  message.textContent="SPINNING...";

  resultNumber.style.opacity=".3";
  resultNumber.style.transform="scale(.85)";

  sound("spin");

  const number=Math.floor(Math.random()*37);
  const color=getColor(number);

  const segment=360/37;
  const target=(number*segment);

  rotation+=
    1440+
    (360-target)+
    Math.random()*12;

  wheel.style.transform="rotate("+rotation+"deg)";

  let tickCount=0;

  const tickTimer=setInterval(()=>{
    sound("tick");
    tickCount++;

    if(tickCount>8){
      clearInterval(tickTimer);
    }
  },350);

  setTimeout(()=>{

    resultNumber.textContent=number;
    resultColor.textContent=color.toUpperCase();

    resultNumber.style.opacity="1";
    resultNumber.style.transform="scale(1.08)";

    setTimeout(()=>{
      resultNumber.style.transform="scale(1)";
    },180);

    let win=false;
    let payout=0;

    if(selectedNumber!==null){
      if(number===selectedNumber){
        win=true;
        payout=selectedChip*36;
      }
    }else if(selectedColor===color){
      win=true;
      payout=color==="green"
        ?selectedChip*14
        :selectedChip*2;
    }

    if(win){

      const newBalance=balance+payout;

      balance=newBalance;

      animateBalance(
        previousBalance-selectedChip,
        newBalance,
        650
      );

      message.className="message win";
      message.textContent=
        "WIN +"+format(payout)+" COINS";

      sound("win");
      particles();

    }else{

      message.className="message loss";
      message.textContent="BET LOST";

      sound("loss");
    }

    addHistory(number,color);

    spinBtn.disabled=false;

  },3800);
}

spinBtn.addEventListener("click",spin);

buildWheelNumbers();
buildNumberGrid();
updateBalance();
updateBet();
</script>

</body>
</html>
