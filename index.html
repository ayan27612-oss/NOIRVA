<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NOIRVA</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#090909;
  color:#fff;
  min-height:100vh;
}
button{font:inherit}
.app{width:100%;max-width:520px;margin:auto;min-height:100vh;background:#101010}

.header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #292929;
  position:sticky;
  top:0;
  background:rgba(16,16,16,.96);
  backdrop-filter:blur(12px);
  z-index:10;
}
.logo{
  font-size:21px;
  letter-spacing:5px;
  font-weight:700;
}
.balance{
  background:#191919;
  border:1px solid #303030;
  border-radius:30px;
  padding:9px 13px;
  font-size:13px;
}
.balance span{color:#aaa;margin-right:4px}

.hero{
  padding:30px 20px 20px;
}
.eyebrow{
  color:#888;
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:8px;
}
h1{
  font-size:34px;
  line-height:1;
  letter-spacing:-1px;
}
.subtitle{
  color:#999;
  margin-top:9px;
  font-size:13px;
}

.game{
  padding:10px 16px 30px;
}

.wheel-wrap{
  display:flex;
  justify-content:center;
  padding:18px 0 25px;
}

.wheel{
  width:245px;
  height:245px;
  border-radius:50%;
  border:8px solid #292929;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    conic-gradient(
      #181818 0deg 15deg,
      #8b1e1e 15deg 30deg,
      #181818 30deg 45deg,
      #8b1e1e 45deg 60deg,
      #181818 60deg 75deg,
      #8b1e1e 75deg 90deg,
      #181818 90deg 105deg,
      #8b1e1e 105deg 120deg,
      #181818 120deg 135deg,
      #8b1e1e 135deg 150deg,
      #181818 150deg 165deg,
      #8b1e1e 165deg 180deg,
      #181818 180deg 195deg,
      #8b1e1e 195deg 210deg,
      #181818 210deg 225deg,
      #8b1e1e 225deg 240deg,
      #181818 240deg 255deg,
      #8b1e1e 255deg 270deg,
      #181818 270deg 285deg,
      #8b1e1e 285deg 300deg,
      #181818 300deg 315deg,
      #8b1e1e 315deg 330deg,
      #181818 330deg 345deg,
      #8b1e1e 345deg 360deg
    );
  transition:transform 3.2s cubic-bezier(.12,.8,.2,1);
  box-shadow:0 0 0 1px #444,0 20px 50px rgba(0,0,0,.5);
}
.wheel:after{
  content:"NOIRVA";
  width:72px;
  height:72px;
  border-radius:50%;
  background:#0d0d0d;
  border:2px solid #555;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  letter-spacing:2px;
  position:absolute;
}
.pointer{
  position:absolute;
  top:3px;
  left:50%;
  transform:translateX(-50%);
  z-index:2;
  width:0;
  height:0;
  border-left:9px solid transparent;
  border-right:9px solid transparent;
  border-top:18px solid #fff;
}

.result{
  text-align:center;
  min-height:46px;
}
.result-number{
  font-size:28px;
  font-weight:700;
}
.result-text{
  font-size:11px;
  color:#888;
  margin-top:4px;
  letter-spacing:1px;
}

.section-title{
  font-size:11px;
  color:#777;
  letter-spacing:2px;
  text-transform:uppercase;
  margin:20px 0 10px;
}

.bet-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}
.bet{
  height:48px;
  border:1px solid #303030;
  background:#181818;
  color:#fff;
  border-radius:7px;
  cursor:pointer;
}
.bet.active{
  border-color:#fff;
  background:#292929;
}

.chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:3px 0 8px;
}
.chip{
  flex:0 0 auto;
  min-width:58px;
  height:40px;
  border-radius:50%;
  border:1px solid #555;
  background:#1b1b1b;
  color:#fff;
  cursor:pointer;
  font-size:12px;
}
.chip.active{
  background:#fff;
  color:#000;
  border-color:#fff;
}

.action{
  width:100%;
  height:54px;
  border:0;
  border-radius:8px;
  background:#fff;
  color:#000;
  font-weight:700;
  letter-spacing:1px;
  margin-top:14px;
  cursor:pointer;
}
.action:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.message{
  min-height:30px;
  text-align:center;
  padding-top:12px;
  color:#aaa;
  font-size:12px;
}

.info{
  border-top:1px solid #292929;
  margin-top:25px;
  padding:22px 20px 35px;
}
.info-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  color:#888;
  font-size:12px;
}
.info-row strong{color:#fff}

@media(min-width:700px){
  body{padding:20px 0}
  .app{
    border:1px solid #292929;
    border-radius:14px;
    overflow:hidden;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">NOIRVA</div>
  <div class="balance">
    <span>COINS</span>
    <strong id="balance">10,000</strong>
  </div>
</header>

<section class="hero">
  <div class="eyebrow">Virtual Casino</div>
  <h1>ROULETTE</h1>
  <p class="subtitle">Play with virtual coins. No real-money wagering.</p>
</section>

<main class="game">

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <div class="wheel" id="wheel"></div>
  </div>

  <div class="result">
    <div class="result-number" id="resultNumber">—</div>
    <div class="result-text" id="resultText">PLACE YOUR BET</div>
  </div>

  <div class="section-title">Choose your bet</div>

  <div class="bet-grid">
    <button class="bet active" data-bet="red">RED</button>
    <button class="bet" data-bet="black">BLACK</button>
    <button class="bet" data-bet="green">GREEN 0</button>
  </div>

  <div class="section-title">Bet amount</div>

  <div class="chips">
    <button class="chip" data-chip="100">100</button>
    <button class="chip active" data-chip="250">250</button>
    <button class="chip" data-chip="500">500</button>
    <button class="chip" data-chip="1000">1K</button>
    <button class="chip" data-chip="2500">2.5K</button>
  </div>

  <button class="action" id="spin">SPIN</button>

  <div class="message" id="message"></div>

</main>

<section class="info">
  <div class="info-row">
    <span>GAME</span>
    <strong>EURO ROULETTE</strong>
  </div>
  <div class="info-row">
    <span>CURRENCY</span>
    <strong>VIRTUAL COINS</strong>
  </div>
  <div class="info-row">
    <span>STATUS</span>
    <strong>DEMO MODE</strong>
  </div>
</section>

</div>

<script>
const wheel=document.getElementById("wheel");
const balanceEl=document.getElementById("balance");
const resultNumber=document.getElementById("resultNumber");
const resultText=document.getElementById("resultText");
const message=document.getElementById("message");
const spinBtn=document.getElementById("spin");

let balance=10000;
let selectedBet="red";
let selectedChip=250;
let rotation=0;

document.querySelectorAll(".bet").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".bet").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    selectedBet=btn.dataset.bet;
  });
});

document.querySelectorAll(".chip").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
    btn.classList.add("active");
    selectedChip=Number(btn.dataset.chip);
  });
});

function updateBalance(){
  balanceEl.textContent=balance.toLocaleString("en-IN");
}

function spin(){
  if(spinBtn.disabled)return;

  if(selectedChip>balance){
    message.textContent="Not enough virtual coins.";
    return;
  }

  balance-=selectedChip;
  updateBalance();

  spinBtn.disabled=true;
  message.textContent="Spinning...";

  const number=Math.floor(Math.random()*37);

  const color=
    number===0
    ?"green"
    :[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(number)
    ?"red"
    :"black";

  const segment=360/24;
  const target=(number%24)*segment;

  rotation+=1440+(360-target);
  wheel.style.transform="rotate("+rotation+"deg)";

  setTimeout(()=>{
    resultNumber.textContent=number;
    resultText.textContent=color.toUpperCase();

    let win=false;
    let payout=0;

    if(selectedBet===color){
      win=true;
      payout=selectedBet==="green"
        ?selectedChip*14
        :selectedChip*2;
    }

    if(win){
      balance+=payout;
      message.textContent="YOU WON +"+payout.toLocaleString("en-IN")+" COINS";
    }else{
      message.textContent="BET LOST";
    }

    updateBalance();
    spinBtn.disabled=false;
  },3300);
}

spinBtn.addEventListener("click",spin);
updateBalance();
</script>

</body>
</html>
