<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>NOIRVA • Mines</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#07080a;
  --panel:#111318;
  --panel2:#181b21;
  --line:#292d36;
  --text:#f5f5f5;
  --muted:#777d89;
  --green:#20d47a;
  --red:#ff4057;
  --gold:#ffc857;
  --blue:#4ea1ff;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% -15%,#252a34 0,#07080a 48%);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

button,input{font:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login{
  width:100%;
  max-width:390px;
  text-align:center;
  animation:loginIn .7s ease;
}

@keyframes loginIn{
  from{opacity:0;transform:translateY(25px)}
  to{opacity:1;transform:translateY(0)}
}

.logoMark{
  width:64px;
  height:64px;
  margin:auto;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:900;
  background:linear-gradient(145deg,#252a33,#0d0f13);
  border:1px solid #373c47;
  box-shadow:0 20px 60px #0009;
}

.brand{
  margin-top:16px;
  font-size:31px;
  font-weight:900;
  letter-spacing:8px;
}

.tag{
  margin-top:7px;
  color:#737985;
  font-size:9px;
  letter-spacing:3px;
}

.loginBox{
  margin-top:35px;
  padding:22px;
  background:#101217;
  border:1px solid #282c34;
  border-radius:18px;
  box-shadow:0 25px 70px #0009;
}

.label{
  display:block;
  text-align:left;
  margin-bottom:8px;
  font-size:9px;
  color:#858b96;
  letter-spacing:1.5px;
}

.input{
  width:100%;
  height:48px;
  margin-bottom:17px;
  padding:0 14px;
  color:white;
  background:#080a0d;
  border:1px solid #292d36;
  border-radius:10px;
  outline:none;
}

.input:focus{border-color:#505662}

.loginBtn{
  width:100%;
  height:50px;
  border-radius:10px;
  background:#f5f5f5;
  color:#08090b;
  font-weight:900;
  letter-spacing:1px;
}

.demo{
  margin-top:15px;
  color:#646a75;
  font-size:9px;
  line-height:1.7;
}

/* HEADER */

header{
  height:64px;
  padding:0 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
  background:#090a0ddd;
  backdrop-filter:blur(18px);
  border-bottom:1px solid #20232a;
}

.headerLogo{
  font-size:17px;
  font-weight:900;
  letter-spacing:4px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:8px;
}

.demoBadge{
  padding:7px 9px;
  border-radius:7px;
  color:#6fe8a5;
  background:#113321;
  border:1px solid #205a3b;
  font-size:8px;
  letter-spacing:1px;
}

.exit{
  padding:8px 10px;
  color:#a0a5af;
  background:#181b21;
  border-radius:7px;
  font-size:9px;
}

/* MAIN */

main{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:18px 14px 40px;
}

.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  margin-bottom:15px;
}

.gameTitle{
  font-size:25px;
  font-weight:900;
}

.gameSubtitle{
  margin-top:4px;
  color:#707681;
  font-size:9px;
  letter-spacing:1.5px;
}

.balance{text-align:right}

.balanceLabel{
  color:#707681;
  font-size:8px;
  letter-spacing:1px;
}

.balanceValue{
  margin-top:3px;
  font-size:18px;
  font-weight:900;
}

/* GAME */

.gameCard{
  padding:14px;
  background:linear-gradient(145deg,#14161b,#0e1014);
  border:1px solid #282c35;
  border-radius:18px;
  box-shadow:0 25px 70px #0008;
}

.statusRow{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-bottom:12px;
}

.stat{
  padding:10px 6px;
  text-align:center;
  background:#090b0e;
  border:1px solid #22262e;
  border-radius:10px;
}

.stat span{
  display:block;
  color:#666c77;
  font-size:8px;
  letter-spacing:1px;
}

.stat strong{
  display:block;
  margin-top:4px;
  font-size:14px;
}

#multiplier{color:var(--gold)}
#currentBet{color:var(--blue)}
#safeCount{color:var(--green)}

/* GRID */

.mineGrid{
  width:100%;
  aspect-ratio:1;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.tile{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:linear-gradient(145deg,#252932,#15181e);
  border:1px solid #353a45;
  box-shadow:
    inset 0 1px #ffffff09,
    0 6px 14px #0008;
  overflow:hidden;
  transition:.18s;
}

.tile:not(.revealed):active{
  transform:scale(.91);
}

.tile:hover{
  border-color:#4a505c;
  transform:translateY(-2px);
}

.hiddenGem{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#555b65;
  box-shadow:0 0 8px #fff1;
}

.tileIcon{
  position:absolute;
  font-size:27px;
  opacity:0;
  transform:scale(.1);
}

.tile.revealed .hiddenGem{display:none}

.tile.revealed .tileIcon{
  opacity:1;
  transform:scale(1);
  transition:.35s cubic-bezier(.2,1.5,.5,1);
}

.tile.diamond{
  background:radial-gradient(circle,#174b37,#0b2119);
  border-color:#20a96a;
  box-shadow:
    inset 0 0 25px #20d47a22,
    0 0 22px #20d47a1c;
  animation:diamond .4s ease;
}

@keyframes diamond{
  0%{transform:scale(.65);opacity:.3}
  70%{transform:scale(1.08)}
  100%{transform:scale(1);opacity:1}
}

.tile.bomb{
  background:radial-gradient(circle,#541c29,#1b0c10);
  border-color:#d63750;
  animation:bomb .5s ease;
}

@keyframes bomb{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(4px)}
}

/* CONTROLS */

.controls{margin-top:14px}

.betLine{
  display:flex;
  gap:7px;
}

.betInput{
  flex:1;
  height:46px;
  padding:0 12px;
  color:white;
  background:#080a0d;
  border:1px solid #292d36;
  border-radius:9px;
  outline:none;
}

.quick{
  min-width:45px;
  height:46px;
  border-radius:9px;
  color:#aeb3bd;
  background:#191c22;
  border:1px solid #2a2e37;
  font-size:9px;
  font-weight:800;
}

.mineCount{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:9px;
}

.mineBtn{
  height:39px;
  border-radius:8px;
  color:#9ca1ac;
  background:#191c22;
  border:1px solid #292d35;
  font-size:9px;
  font-weight:800;
}

.mineBtn.active{
  color:white;
  background:#17432f;
  border-color:#238456;
}

.actionRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.startBtn,.cashBtn{
  height:50px;
  border-radius:10px;
  font-weight:900;
  letter-spacing:1px;
  transition:.18s;
}

.startBtn{
  color:#03150c;
  background:linear-gradient(135deg,#27df82,#0da65b);
}

.cashBtn{
  color:#b7bcc5;
  background:#252932;
  border:1px solid #353a44;
}

.cashBtn.ready{
  color:#1a1203;
  background:#ffc857;
  animation:pulse 1.4s infinite;
}

@keyframes pulse{
  50%{box-shadow:0 0 25px #ffc85744}
}

.startBtn:active,.cashBtn:active{
  transform:scale(.97);
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
  animation:none!important;
}

/* MESSAGE */

.message{
  min-height:20px;
  margin-top:10px;
  text-align:center;
  color:#858b96;
  font-size:10px;
}

.message.win{color:var(--green)}
.message.lose{color:var(--red)}

/* INFO */

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}

.infoBox{
  padding:13px;
  background:#111319;
  border:1px solid #252933;
  border-radius:12px;
}

.infoTitle{
  color:#777d88;
  font-size:8px;
  letter-spacing:1.2px;
}

.infoValue{
  margin-top:5px;
  font-size:15px;
  font-weight:900;
}

.green{color:var(--green)}

/* HISTORY */

.history{margin-top:15px}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  margin-bottom:9px;
}

.sectionTitle strong{
  font-size:10px;
  letter-spacing:1px;
}

.sectionTitle span{
  color:#646a75;
  font-size:8px;
}

.historyList{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
}

.historyList::-webkit-scrollbar{display:none}

.historyItem{
  min-width:70px;
  padding:9px 6px;
  text-align:center;
  background:#111319;
  border:1px solid #252933;
  border-radius:9px;
}

.hIcon{font-size:17px}
.hText{
  margin-top:4px;
  color:#858b95;
  font-size:8px;
}

/* PARTICLES */

.particle{
  position:fixed;
  width:7px;
  height:7px;
  border-radius:50%;
  pointer-events:none;
  z-index:100;
  animation:particle .8s ease-out forwards;
}

@keyframes particle{
  from{
    opacity:1;
    transform:translate(0,0) scale(1);
  }
  to{
    opacity:0;
    transform:translate(var(--x),var(--y)) scale(0);
  }
}

@media(max-width:380px){
  main{padding:14px 10px 30px}
  .gameCard{padding:10px}
  .mineGrid{gap:5px}
  .tile{border-radius:8px;font-size:21px}
  .demoBadge{display:none}
}

@media(min-width:700px){
  main{padding-top:30px}
  .tileIcon{font-size:32px}
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen">

  <div class="login">

    <div class="logoMark">N</div>

    <div class="brand">NOIRVA</div>

    <div class="tag">PRIVATE VIRTUAL GAMING</div>

    <div class="loginBox">

      <label class="label">USERNAME</label>

      <input
        class="input"
        id="username"
        type="text"
        placeholder="Enter username"
        autocomplete="off"
      >

      <label class="label">PASSWORD</label>

      <input
        class="input"
        id="password"
        type="password"
        placeholder="Enter password"
      >

      <button class="loginBtn" id="loginBtn">
        ENTER NOIRVA
      </button>

      <div class="demo" id="loginError"></div>

      <div class="demo">
        DEMO ACCESS • VIRTUAL COINS ONLY<br>
        No real-money wagering or withdrawals.
      </div>

    </div>

  </div>

</section>


<!-- GAME -->

<section id="gameScreen" class="hidden">

<header>

  <div class="headerLogo">NOIRVA</div>

  <div class="headerRight">

    <div class="demoBadge">
      DEMO • VIRTUAL
    </div>

    <button class="exit" id="exitBtn">
      EXIT
    </button>

  </div>

</header>


<main>

  <div class="topbar">

    <div>
      <div class="gameTitle">MINES</div>
      <div class="gameSubtitle">FIND THE DIAMONDS</div>
    </div>

    <div class="balance">
      <div class="balanceLabel">BALANCE</div>
      <div class="balanceValue" id="balance">
        10,000
      </div>
    </div>

  </div>


  <div class="gameCard">

    <div class="statusRow">

      <div class="stat">
        <span>BET</span>
        <strong id="currentBet">100</strong>
      </div>

      <div class="stat">
        <span>MULTIPLIER</span>
        <strong id="multiplier">1.00x</strong>
      </div>

      <div class="stat">
        <span>SAFE</span>
        <strong id="safeCount">22</strong>
      </div>

    </div>


    <div class="mineGrid" id="mineGrid"></div>


    <div class="message" id="message">
      Choose your bet and start a round.
    </div>


    <div class="controls">

      <div class="betLine">

        <input
          class="betInput"
          id="betInput"
          type="number"
          min="10"
          value="100"
          inputmode="numeric"
        >

        <button class="quick" data-bet="100">
          100
        </button>

        <button class="quick" data-bet="500">
          500
        </button>

        <button class="quick" data-bet="1000">
          1K
        </button>

      </div>


      <div class="mineCount">

        <button class="mineBtn active" data-mines="3">
          3 BOMBS
        </button>

        <button class="mineBtn" data-mines="5">
          5 BOMBS
        </button>

        <button class="mineBtn" data-mines="8">
          8 BOMBS
        </button>

        <button class="mineBtn" data-mines="12">
          12 BOMBS
        </button>

      </div>


      <div class="actionRow">

        <button class="startBtn" id="startBtn">
          START ROUND
        </button>

        <button class="cashBtn" id="cashBtn" disabled>
          CASH OUT
        </button>

      </div>

    </div>

  </div>


  <div class="info">

    <div class="infoBox">
      <div class="infoTitle">ROUND WIN</div>
      <div class="infoValue green" id="roundWin">0</div>
    </div>

    <div class="infoBox">
      <div class="infoTitle">LAST RESULT</div>
      <div class="infoValue" id="lastResult">—</div>
    </div>

  </div>


  <div class="history">

    <div class="sectionTitle">
      <strong>RECENT ROUNDS</strong>
      <span>VIRTUAL HISTORY</span>
    </div>

    <div class="historyList" id="historyList"></div>

  </div>

</main>

</section>


<script>

/* =========================
   GAME STATE
========================= */

let balance = 10000;
let bet = 100;
let mines = 3;

let board = [];
let gameActive = false;
let revealed = 0;
let multiplier = 1;


/* =========================
   AUDIO
========================= */

let audioCtx = null;

function audioReady(){

  if(!audioCtx){
    audioCtx =
      new(window.AudioContext ||
      window.webkitAudioContext)();
  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}

function tone(freq,duration,type="sine",volume=.04){

  audioReady();

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(
    0,
    audioCtx.currentTime
  );

  gain.gain.linearRampToValueAtTime(
    volume,
    audioCtx.currentTime+.015
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime+duration
  );
}

function sound(type){

  if(type==="click"){
    tone(520,.06,"square",.025);
  }

  if(type==="diamond"){

    tone(700,.08,"sine",.04);

    setTimeout(()=>{
      tone(1050,.14,"sine",.04);
    },70);
  }

  if(type==="cash"){

    tone(500,.08,"sine",.035);

    setTimeout(()=>{
      tone(750,.1,"sine",.04);
    },80);

    setTimeout(()=>{
      tone(1050,.18,"sine",.045);
    },170);
  }

  if(type==="bomb"){

    tone(90,.25,"sawtooth",.07);

    setTimeout(()=>{
      tone(55,.35,"sawtooth",.04);
    },100);
  }
}


/* =========================
   LOGIN
========================= */

document.getElementById("loginBtn").onclick=()=>{

  audioReady();
  sound("click");

  const username =
    document.getElementById("username")
    .value.trim();

  const password =
    document.getElementById("password")
    .value;

  const error =
    document.getElementById("loginError");

  if(username.length<2 ||
     password.length<3){

    error.textContent =
      "Enter a username and password of at least 3 characters.";

    return;
  }

  error.textContent="";

  document.getElementById("loginScreen")
    .classList.add("hidden");

  document.getElementById("gameScreen")
    .classList.remove("hidden");

  resetRoundBoard();

};


/* =========================
   EXIT
========================= */

document.getElementById("exitBtn").onclick=()=>{

  gameActive=false;

  document.getElementById("gameScreen")
    .classList.add("hidden");

  document.getElementById("loginScreen")
    .classList.remove("hidden");
};


/* =========================
   QUICK BET
========================= */

document.querySelectorAll(".quick")
.forEach(button=>{

  button.onclick=()=>{

    sound("click");

    document.getElementById("betInput")
      .value=button.dataset.bet;

    bet=Number(button.dataset.bet);

    updateUI();
  };

});


document.getElementById("betInput")
.oninput=e=>{

  bet=Number(e.target.value)||0;

  updateUI();
};


/* =========================
   MINE COUNT
========================= */

document.querySelectorAll(".mineBtn")
.forEach(button=>{

  button.onclick=()=>{

    if(gameActive)return;

    sound("click");

    document.querySelectorAll(".mineBtn")
    .forEach(x=>{
      x.classList.remove("active");
    });

    button.classList.add("active");

    mines =
      Number(button.dataset.mines);

    resetRoundBoard();

  };

});


/* =========================
   BUILD FRESH BOARD
========================= */

function buildBoard(){

  const grid =
    document.getElementById("mineGrid");

  grid.innerHTML="";

  board=[];

  for(let i=0;i<25;i++){

    board.push({
      mine:false,
      revealed:false
    });

    const tile =
      document.createElement("button");

    tile.className="tile";

    tile.innerHTML=`
      <div class="hiddenGem"></div>
      <div class="tileIcon"></div>
    `;

    tile.onclick=()=>{
      revealTile(i);
    };

    grid.appendChild(tile);
  }

  updateUI();
}


/* =========================
   RESET ROUND BOARD
========================= */

function resetRoundBoard(){

  gameActive=false;

  revealed=0;

  multiplier=1;

  /* DELETE EVERYTHING
     FROM PREVIOUS ROUND */

  board=[];

  const grid =
    document.getElementById("mineGrid");

  if(grid){
    grid.innerHTML="";
  }

  /* BUILD 25 COMPLETELY
     NEW HIDDEN TILES */

  buildBoard();

  /* RESET CONTROLS */

  document.getElementById("cashBtn")
    .disabled=true;

  document.getElementById("cashBtn")
    .classList.remove("ready");

  document.getElementById("startBtn")
    .disabled=false;

  document.getElementById("betInput")
    .disabled=false;

  document.querySelectorAll(".mineBtn")
    .forEach(x=>{
      x.disabled=false;
    });

  /* RESET ROUND INFO */

  document.getElementById("roundWin")
    .textContent="0";

  document.getElementById("lastResult")
    .textContent="—";

  showMessage(
    "Choose your bet and start a round."
  );

  updateUI();
}


/* =========================
   START ROUND
========================= */

document.getElementById("startBtn")
.onclick=()=>{

  audioReady();
  sound("click");

  if(gameActive)return;

  bet =
    Number(
      document.getElementById("betInput").value
    ) || 0;

  if(bet<10){

    showMessage(
      "Minimum virtual bet is 10 coins."
    );

    return;
  }

  if(bet>balance){

    showMessage(
      "Not enough virtual coins."
    );

    return;
  }

  /* TAKE VIRTUAL BET */

  balance-=bet;

  gameActive=true;

  revealed=0;

  multiplier=1;

  /* NEW RANDOM MINES */

  createMines();

  document.getElementById("cashBtn")
    .disabled=true;

  document.getElementById("startBtn")
    .disabled=true;

  document.getElementById("betInput")
    .disabled=true;

  document.querySelectorAll(".mineBtn")
    .forEach(x=>{
      x.disabled=true;
    });

  showMessage(
    "Round started. Find the diamonds."
  );

  updateUI();
};


/* =========================
   CREATE RANDOM MINES
========================= */

function createMines(){

  board.forEach(tile=>{
    tile.mine=false;
    tile.revealed=false;
  });

  let placed=0;

  while(placed<mines){

    const index =
      Math.floor(Math.random()*25);

    if(!board[index].mine){

      board[index].mine=true;

      placed++;
    }
  }
}


/* =========================
   REVEAL TILE
========================= */

function revealTile(index){

  if(!gameActive)return;

  const data=board[index];

  if(data.revealed)return;

  data.revealed=true;

  const tiles =
    document.querySelectorAll(".tile");

  const tile=tiles[index];

  tile.classList.add("revealed");


  /* BOMB */

  if(data.mine){

    tile.classList.add("bomb");

    tile.querySelector(".tileIcon")
      .textContent="💣";

    sound("bomb");

    revealAllMines();

    gameActive=false;

    document.getElementById("cashBtn")
      .disabled=true;

    document.getElementById("startBtn")
      .disabled=false;

    document.getElementById("betInput")
      .disabled=false;

    document.querySelectorAll(".mineBtn")
      .forEach(x=>{
        x.disabled=false;
      });

    document.getElementById("lastResult")
      .textContent="BOMB";

    document.getElementById("roundWin")
      .textContent="0";

    showMessage(
      "💣 Bomb found. Round ended.",
      "lose"
    );

    addHistory("💣","Bomb");

    updateUI();

    /* IMPORTANT:
       WAIT FOR ANIMATION,
       THEN FULL RESET */

    setTimeout(()=>{
      resetRoundBoard();
    },1000);

    return;
  }


  /* DIAMOND */

  revealed++;

  tile.classList.add("diamond");

  tile.querySelector(".tileIcon")
    .textContent="💎";

  sound("diamond");

  createParticles(tile);

  multiplier =
    calculateMultiplier();

  const potential =
    Math.floor(bet*multiplier);

  document.getElementById("roundWin")
    .textContent=format(potential);

  document.getElementById("cashBtn")
    .disabled=false;

  document.getElementById("cashBtn")
    .classList.add("ready");

  showMessage(
    `💎 Diamond found • ${multiplier.toFixed(2)}x`
  );

  /* ALL SAFE TILES FOUND */

  if(revealed >= 25-mines){

    setTimeout(()=>{
      cashOut();
    },300);

    return;
  }

  updateUI();
}


/* =========================
   MULTIPLIER
========================= */

function calculateMultiplier(){

  const safeTotal =
    25-mines;

  let value=1;

  for(let i=0;i<revealed;i++){

    value *=
      (25-i) /
      (safeTotal-i);
  }

  return Math.max(1,value*.96);
}


/* =========================
   CASH OUT
========================= */

document.getElementById("cashBtn")
.onclick=()=>{

  cashOut();

};


function cashOut(){

  if(!gameActive || revealed<=0)
    return;

  const win =
    Math.floor(bet*multiplier);

  balance+=win;

  gameActive=false;

  sound("cash");

  createScreenParticles();

  document.getElementById("cashBtn")
    .disabled=true;

  document.getElementById("cashBtn")
    .classList.remove("ready");

  document.getElementById("startBtn")
    .disabled=false;

  document.getElementById("betInput")
    .disabled=false;

  document.querySelectorAll(".mineBtn")
    .forEach(x=>{
      x.disabled=false;
    });

  document.getElementById("roundWin")
    .textContent=format(win);

  document.getElementById("lastResult")
    .textContent="+"+format(win);

  showMessage(
    `CASHED OUT • ${format(win)} VIRTUAL COINS`,
    "win"
  );

  addHistory(
    "💎",
    `${multiplier.toFixed(2)}x`
  );

  updateUI();

  /* IMPORTANT:
     AFTER WIN, CLEAR ALL OLD
     DIAMONDS/BOMBS */

  setTimeout(()=>{
    resetRoundBoard();
  },1000);
}


/* =========================
   REVEAL ALL BOMBS
========================= */

function revealAllMines(){

  board.forEach((data,index)=>{

    if(data.mine){

      const tile =
        document.querySelectorAll(".tile")[index];

      if(tile){

        tile.classList.add(
          "revealed",
          "bomb"
        );

        tile.querySelector(".tileIcon")
          .textContent="💣";
      }
    }
  });
}


/* =========================
   PARTICLES
========================= */

function createParticles(tile){

  const rect =
    tile.getBoundingClientRect();

  for(let i=0;i<12;i++){

    const p =
      document.createElement("div");

    p.className="particle";

    p.style.left =
      rect.left+
      rect.width/2+
      "px";

    p.style.top =
      rect.top+
      rect.height/2+
      "px";

    p.style.background =
      i%2 ? "#20d47a" : "#ffc857";

    p.style.setProperty(
      "--x",
      (Math.random()*120-60)+"px"
    );

    p.style.setProperty(
      "--y",
      (Math.random()*-130-20)+"px"
    );

    document.body.appendChild(p);

    setTimeout(()=>{
      p.remove();
    },850);
  }
}


function createScreenParticles(){

  for(let i=0;i<30;i++){

    const p =
      document.createElement("div");

    p.className="particle";

    p.style.left="50%";
    p.style.top="50%";

    p.style.background =
      i%2 ? "#20d47a" : "#ffc857";

    p.style.setProperty(
      "--x",
      (Math.random()*360-180)+"px"
    );

    p.style.setProperty(
      "--y",
      (Math.random()*360-180)+"px"
    );

    document.body.appendChild(p);

    setTimeout(()=>{
      p.remove();
    },850);
  }
}


/* =========================
   HISTORY
========================= */

function addHistory(icon,text){

  const list =
    document.getElementById("historyList");

  const item =
    document.createElement("div");

  item.className="historyItem";

  item.innerHTML=`
    <div class="hIcon">${icon}</div>
    <div class="hText">${text}</div>
  `;

  list.prepend(item);

  while(list.children.length>8){
    list.lastChild.remove();
  }
}


/* =========================
   MESSAGE
========================= */

function showMessage(text,type=""){

  const el =
    document.getElementById("message");

  el.textContent=text;

  el.className =
    "message "+type;
}


/* =========================
   UI
========================= */

function format(number){

  return Number(number)
    .toLocaleString("en-IN");
}


function updateUI(){

  const balanceEl =
    document.getElementById("balance");

  if(balanceEl){
    balanceEl.textContent=
      format(balance);
  }

  const betEl =
    document.getElementById("currentBet");

  if(betEl){
    betEl.textContent=
      format(bet);
  }

  const multiEl =
    document.getElementById("multiplier");

  if(multiEl){
    multiEl.textContent=
      multiplier.toFixed(2)+"x";
  }

  const safeEl =
    document.getElementById("safeCount");

  if(safeEl){
    safeEl.textContent=
      Math.max(
        0,
        25-mines-revealed
      );
  }
}


/* =========================
   INITIAL BOARD
========================= */

buildBoard();

</script>

</body>
</html>
