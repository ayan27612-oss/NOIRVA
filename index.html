<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NOIRVA • Mines</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#08090b;
  --panel:#111318;
  --panel2:#171920;
  --line:#252832;
  --text:#f5f5f5;
  --muted:#858a96;
  --green:#20d47a;
  --green2:#0ea85d;
  --red:#ff4057;
  --gold:#ffc857;
  --blue:#4ea1ff;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:
    radial-gradient(circle at 50% -10%,#20242d 0,#08090b 45%);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
}

.login{
  width:100%;
  max-width:390px;
  text-align:center;
  animation:loginIn .7s ease;
}

@keyframes loginIn{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.logoMark{
  width:64px;
  height:64px;
  margin:0 auto 16px;
  border:1px solid #353943;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:900;
  background:linear-gradient(145deg,#20242c,#0e1014);
  box-shadow:0 15px 45px #0008;
}

.brand{
  font-size:31px;
  letter-spacing:8px;
  font-weight:900;
}

.tag{
  margin-top:7px;
  color:#747985;
  font-size:10px;
  letter-spacing:3px;
}

.loginBox{
  margin-top:35px;
  padding:22px;
  background:#101217;
  border:1px solid #272a32;
  border-radius:18px;
  box-shadow:0 25px 70px #0008;
}

.label{
  display:block;
  text-align:left;
  font-size:10px;
  color:#858a95;
  letter-spacing:1.5px;
  margin:0 0 8px;
}

.input{
  width:100%;
  height:48px;
  margin-bottom:17px;
  padding:0 14px;
  color:white;
  background:#090a0d;
  border:1px solid #292d36;
  border-radius:10px;
  outline:none;
}

.input:focus{
  border-color:#4a505c;
}

.loginBtn{
  width:100%;
  height:50px;
  border-radius:10px;
  background:#f5f5f5;
  color:#08090b;
  font-weight:900;
  letter-spacing:1px;
  transition:.2s;
}

.loginBtn:active{
  transform:scale(.97);
}

.demo{
  margin-top:16px;
  color:#626772;
  font-size:10px;
  line-height:1.7;
}

/* APP */

.app{
  min-height:100vh;
}

header{
  height:64px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #20232a;
  background:#090a0cdd;
  backdrop-filter:blur(18px);
  position:sticky;
  top:0;
  z-index:50;
}

.headerLogo{
  font-size:17px;
  font-weight:900;
  letter-spacing:4px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:9px;
}

.demoBadge{
  padding:7px 9px;
  border-radius:7px;
  font-size:8px;
  letter-spacing:1px;
  color:#70e9a9;
  background:#123222;
  border:1px solid #205b3a;
}

.exit{
  padding:8px 10px;
  border-radius:7px;
  color:#999eaa;
  background:#181a20;
  font-size:9px;
}

/* MAIN */

main{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:18px 14px 35px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:15px;
}

.gameTitle{
  font-size:24px;
  font-weight:900;
}

.gameSubtitle{
  margin-top:4px;
  font-size:10px;
  color:#707580;
  letter-spacing:1px;
}

.balance{
  text-align:right;
}

.balanceLabel{
  color:#707580;
  font-size:8px;
  letter-spacing:1px;
}

.balanceValue{
  margin-top:3px;
  font-size:18px;
  font-weight:900;
  color:#fff;
}

/* GAME CARD */

.gameCard{
  padding:14px;
  border:1px solid #242832;
  background:linear-gradient(145deg,#13151a,#0e1014);
  border-radius:18px;
  box-shadow:0 25px 70px #0007;
}

.statusRow{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-bottom:12px;
}

.stat{
  padding:10px 8px;
  border-radius:10px;
  background:#090b0e;
  border:1px solid #20232a;
  text-align:center;
}

.stat span{
  display:block;
  font-size:8px;
  color:#686e79;
  letter-spacing:1px;
}

.stat strong{
  display:block;
  margin-top:4px;
  font-size:14px;
}

#multiplier{
  color:var(--gold);
}

#currentBet{
  color:var(--blue);
}

/* GRID */

.mineGrid{
  width:100%;
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.tile{
  position:relative;
  border-radius:11px;
  border:1px solid #30343e;
  background:
    linear-gradient(145deg,#22262f,#14171c);
  box-shadow:
    inset 0 1px #ffffff08,
    0 5px 12px #0007;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  overflow:hidden;
  transition:
    transform .18s,
    background .25s,
    border-color .25s,
    box-shadow .25s;
}

.tile:not(.revealed):active{
  transform:scale(.92);
}

.tile:not(.revealed):hover{
  border-color:#464c58;
  transform:translateY(-2px);
}

.tile::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,#ffffff08,transparent);
  transform:translateX(-100%);
}

.tile:not(.revealed):hover::after{
  animation:shine .6s;
}

@keyframes shine{
  to{transform:translateX(100%)}
}

.tile.revealed{
  cursor:default;
}

.tile.diamond{
  background:
    radial-gradient(circle at 50% 45%,#153f31,#0c201a);
  border-color:#1c9e65;
  box-shadow:
    inset 0 0 25px #18d67818,
    0 0 20px #18d67816;
  animation:diamondReveal .45s ease;
}

@keyframes diamondReveal{
  0%{
    transform:scale(.65) rotate(-8deg);
    opacity:.3;
  }
  70%{
    transform:scale(1.08);
  }
  100%{
    transform:scale(1);
  }
}

.tile.bomb{
  background:
    radial-gradient(circle at 50% 45%,#481923,#1c0d11);
  border-color:#c52f48;
  animation:bombReveal .5s ease;
}

@keyframes bombReveal{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(4px)}
}

.hiddenGem{
  width:11px;
  height:11px;
  border-radius:50%;
  background:#555b67;
  box-shadow:0 0 8px #ffffff08;
}

.tile.revealed .hiddenGem{
  display:none;
}

.tileIcon{
  opacity:0;
  transform:scale(.2);
}

.tile.revealed .tileIcon{
  opacity:1;
  transform:scale(1);
  transition:.35s cubic-bezier(.2,1.5,.5,1);
}

/* CONTROLS */

.controls{
  margin-top:14px;
}

.betLine{
  display:flex;
  gap:8px;
  align-items:center;
}

.betInput{
  flex:1;
  height:46px;
  background:#090b0e;
  border:1px solid #282c35;
  color:white;
  border-radius:9px;
  padding:0 13px;
  outline:none;
}

.quick{
  height:46px;
  min-width:44px;
  border-radius:9px;
  background:#191c22;
  border:1px solid #292d35;
  color:#aeb2bc;
  font-size:10px;
  font-weight:800;
}

.quick:active{
  transform:scale(.94);
}

.mineCount{
  margin-top:10px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.mineBtn{
  height:39px;
  border-radius:8px;
  color:#9ca1ac;
  background:#181b20;
  border:1px solid #282c34;
  font-size:10px;
  font-weight:800;
}

.mineBtn.active{
  color:white;
  background:#183d2c;
  border-color:#238354;
}

.actionRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.startBtn,
.cashBtn{
  height:50px;
  border-radius:10px;
  font-weight:900;
  letter-spacing:1px;
  transition:.18s;
}

.startBtn{
  background:linear-gradient(135deg,#24dc7f,#0ea95d);
  color:#03150c;
  box-shadow:0 8px 25px #16bd691c;
}

.cashBtn{
  background:#242831;
  color:#b5bac5;
  border:1px solid #343943;
}

.cashBtn.ready{
  background:#ffc857;
  color:#171107;
  border-color:#ffd97f;
  animation:pulseCash 1.5s infinite;
}

@keyframes pulseCash{
  50%{
    box-shadow:0 0 25px #ffc85733;
  }
}

.startBtn:active,
.cashBtn:active{
  transform:scale(.97);
}

.startBtn:disabled,
.cashBtn:disabled{
  opacity:.4;
  cursor:not-allowed;
  animation:none;
}

/* INFO */

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}

.infoBox{
  padding:13px;
  border-radius:12px;
  background:#111319;
  border:1px solid #242831;
}

.infoTitle{
  font-size:9px;
  letter-spacing:1.2px;
  color:#777d88;
}

.infoValue{
  margin-top:5px;
  font-size:15px;
  font-weight:900;
}

.infoValue.green{
  color:var(--green);
}

.infoValue.red{
  color:var(--red);
}

/* HISTORY */

.history{
  margin-top:15px;
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
}

.sectionTitle strong{
  font-size:11px;
  letter-spacing:1px;
}

.sectionTitle span{
  font-size:8px;
  color:#646a75;
}

.historyList{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
}

.historyList::-webkit-scrollbar{
  display:none;
}

.historyItem{
  min-width:72px;
  padding:10px 7px;
  border:1px solid #252933;
  border-radius:9px;
  background:#111319;
  text-align:center;
}

.historyItem .hIcon{
  font-size:17px;
}

.historyItem .hText{
  margin-top:4px;
  font-size:8px;
  color:#888e99;
}

/* MESSAGE */

.message{
  text-align:center;
  min-height:19px;
  margin-top:11px;
  font-size:10px;
  color:#858b96;
}

.message.win{
  color:var(--green);
}

.message.lose{
  color:var(--red);
}

/* PARTICLES */

.particle{
  position:fixed;
  width:7px;
  height:7px;
  border-radius:50%;
  pointer-events:none;
  z-index:100;
  animation:particleFly .8s ease-out forwards;
}

@keyframes particleFly{
  from{
    opacity:1;
    transform:translate(0,0) scale(1);
  }
  to{
    opacity:0;
    transform:translate(var(--x),var(--y)) scale(0);
  }
}

/* RESPONSIVE */

@media(max-width:380px){
  main{
    padding:14px 10px 30px;
  }

  .gameCard{
    padding:10px;
  }

  .mineGrid{
    gap:5px;
  }

  .tile{
    border-radius:8px;
    font-size:21px;
  }

  .demoBadge{
    display:none;
  }

  .brand{
    font-size:27px;
  }
}

@media(min-width:700px){
  main{
    padding-top:30px;
  }

  .tile{
    font-size:32px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen">
  <div class="login">

    <div class="logoMark">N</div>

    <div class="brand">NOIRVA</div>
    <div class="tag">PRIVATE VIRTUAL GAMING</div>

    <div class="loginBox">

      <label class="label">USERNAME</label>
      <input
        class="input"
        id="username"
        type="text"
        placeholder="Enter username"
        autocomplete="off"
      >

      <label class="label">PASSWORD</label>
      <input
        class="input"
        id="password"
        type="password"
        placeholder="Enter password"
      >

      <button class="loginBtn" id="loginBtn">
        ENTER NOIRVA
      </button>

      <div class="demo" id="loginError"></div>

      <div class="demo">
        DEMO ACCESS • VIRTUAL COINS ONLY<br>
        No real-money wagering or withdrawals.
      </div>

    </div>
  </div>
</section>


<!-- GAME -->

<section id="gameScreen" class="app hidden">

<header>

  <div class="headerLogo">NOIRVA</div>

  <div class="headerRight">
    <div class="demoBadge">DEMO • VIRTUAL</div>
    <button class="exit" id="exitBtn">EXIT</button>
  </div>

</header>


<main>

  <div class="topbar">

    <div>
      <div class="gameTitle">MINES</div>
      <div class="gameSubtitle">FIND THE DIAMONDS</div>
    </div>

    <div class="balance">
      <div class="balanceLabel">BALANCE</div>
      <div class="balanceValue" id="balance">10,000</div>
    </div>

  </div>


  <div class="gameCard">

    <div class="statusRow">

      <div class="stat">
        <span>BET</span>
        <strong id="currentBet">0</strong>
      </div>

      <div class="stat">
        <span>MULTIPLIER</span>
        <strong id="multiplier">1.00x</strong>
      </div>

      <div class="stat">
        <span>SAFE</span>
        <strong id="safeCount">25</strong>
      </div>

    </div>


    <div class="mineGrid" id="mineGrid"></div>


    <div class="message" id="message">
      Choose your bet and start a round.
    </div>


    <div class="controls">

      <div class="betLine">

        <input
          class="betInput"
          id="betInput"
          type="number"
          min="10"
          value="100"
          inputmode="numeric"
        >

        <button class="quick" data-bet="100">100</button>
        <button class="quick" data-bet="500">500</button>
        <button class="quick" data-bet="1000">1K</button>

      </div>


      <div class="mineCount">

        <button class="mineBtn active" data-mines="3">3 BOMBS</button>
        <button class="mineBtn" data-mines="5">5 BOMBS</button>
        <button class="mineBtn" data-mines="8">8 BOMBS</button>
        <button class="mineBtn" data-mines="12">12 BOMBS</button>

      </div>


      <div class="actionRow">

        <button class="startBtn" id="startBtn">
          START ROUND
        </button>

        <button class="cashBtn" id="cashBtn" disabled>
          CASH OUT
        </button>

      </div>

    </div>

  </div>


  <div class="info">

    <div class="infoBox">
      <div class="infoTitle">ROUND WIN</div>
      <div class="infoValue green" id="roundWin">0</div>
    </div>

    <div class="infoBox">
      <div class="infoTitle">LAST RESULT</div>
      <div class="infoValue" id="lastResult">—</div>
    </div>

  </div>


  <div class="history">

    <div class="sectionTitle">
      <strong>RECENT ROUNDS</strong>
      <span>VIRTUAL HISTORY</span>
    </div>

    <div class="historyList" id="historyList"></div>

  </div>

</main>

</section>


<script>

/* =========================
   STATE
========================= */

let balance = 10000;
let bet = 100;
let mines = 3;

let board = [];
let gameActive = false;
let revealed = 0;
let multiplier = 1;


/* =========================
   AUDIO
========================= */

let audioCtx;

function audioReady(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}

function tone(freq,duration,type="sine",volume=.04){

  audioReady();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.value = freq;

  gain.gain.setValueAtTime(0,audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(
    volume,
    audioCtx.currentTime+.015
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime+duration);
}

function sound(type){

  if(type==="click"){
    tone(520,.06,"square",.025);
  }

  if(type==="diamond"){
    tone(700,.08,"sine",.04);
    setTimeout(()=>tone(1050,.14,"sine",.04),70);
  }

  if(type==="cash"){
    tone(500,.08,"sine",.035);
    setTimeout(()=>tone(750,.1,"sine",.04),80);
    setTimeout(()=>tone(1050,.18,"sine",.045),170);
  }

  if(type==="bomb"){
    tone(90,.25,"sawtooth",.07);
    setTimeout(()=>tone(55,.35,"sawtooth",.04),100);
  }
}


/* =========================
   LOGIN
========================= */

document.getElementById("loginBtn").onclick=()=>{

  audioReady();
  sound("click");

  const username=
    document.getElementById("username").value.trim();

  const password=
    document.getElementById("password").value;

  const error=
    document.getElementById("loginError");

  if(username.length<2 || password.length<3){

    error.textContent=
      "Enter a username and a password of at least 3 characters.";

    return;
  }

  error.textContent="";

  document.getElementById("loginScreen")
    .classList.add("hidden");

  document.getElementById("gameScreen")
    .classList.remove("hidden");

  buildBoard();

};


document.getElementById("exitBtn").onclick=()=>{

  gameActive=false;

  document.getElementById("gameScreen")
    .classList.add("hidden");

  document.getElementById("loginScreen")
    .classList.remove("hidden");

};


/* =========================
   BET
========================= */

document.querySelectorAll(".quick").forEach(btn=>{

  btn.onclick=()=>{

    sound("click");

    document.getElementById("betInput").value=
      btn.dataset.bet;

    bet=Number(btn.dataset.bet);
  };

});


document.getElementById("betInput").oninput=e=>{
  bet=Number(e.target.value)||0;
};


/* =========================
   MINES
========================= */

document.querySelectorAll(".mineBtn").forEach(btn=>{

  btn.onclick=()=>{

    if(gameActive) return;

    sound("click");

    document.querySelectorAll(".mineBtn")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    mines=Number(btn.dataset.mines);

    buildBoard();

  };

});


/* =========================
   BOARD
========================= */

function buildBoard(){

  const grid=document.getElementById("mineGrid");

  grid.innerHTML="";

  board=[];

  revealed=0;
  multiplier=1;

  for(let i=0;i<25;i++){

    board.push({
      mine:false,
      revealed:false
    });

    const tile=document.createElement("button");

    tile.className="tile";

    tile.innerHTML=`
      <div class="hiddenGem"></div>
      <div class="tileIcon"></div>
    `;

    tile.onclick=()=>revealTile(i);

    grid.appendChild(tile);
  }

  updateUI();
}


/* =========================
   START
========================= */

document.getElementById("startBtn").onclick=()=>{

  audioReady();
  sound("click");

  if(gameActive) return;

  bet=Number(document.getElementById("betInput").value)||0;

  if(bet<10){

    showMessage("Minimum virtual bet is 10 coins.");

    return;
  }

  if(bet>balance){

    showMessage("Not enough virtual coins.");

    return;
  }

  balance-=bet;

  gameActive=true;
  revealed=0;
  multiplier=1;

  createMines();

  document.getElementById("cashBtn")
    .disabled=false;

  document.getElementById("startBtn")
    .disabled=true;

  document.getElementById("betInput")
    .disabled=true;

  document.querySelectorAll(".mineBtn")
    .forEach(x=>x.disabled=true);

  showMessage("Round started. Find the diamonds.");

  updateUI();
};


/* =========================
   CREATE MINES
========================= */

function createMines(){

  board.forEach(x=>{
    x.mine=false;
    x.revealed=false;
  });

  let placed=0;

  while(placed<mines){

    const index=
      Math.floor(Math.random()*25);

    if(!board[index].mine){

      board[index].mine=true;
      placed++;

    }
  }
}


/* =========================
   REVEAL
========================= */

function revealTile(index){

  if(!gameActive) return;

  const data=board[index];

  if(data.revealed) return;

  data.revealed=true;

  const tile=
    document.querySelectorAll(".tile")[index];

  tile.classList.add("revealed");

  if(data.mine){

    tile.classList.add("bomb");

    tile.querySelector(".tileIcon").textContent="💣";

    sound("bomb");

    revealAllMines();

    gameActive=false;

    document.getElementById("cashBtn")
      .disabled=true;

    document.getElementById("startBtn")
      .disabled=false;

    document.getElementById("betInput")
      .disabled=false;

    document.querySelectorAll(".mineBtn")
      .forEach(x=>x.disabled=false);

    document.getElementById("lastResult").textContent=
      "BOMB";

    document.getElementById("roundWin").textContent="0";

    showMessage(
      "💣 Bomb found. Round ended.",
      "lose"
    );

    addHistory("💣","Bomb");

    updateUI();

    return;
  }


  revealed++;

  tile.classList.add("diamond");

  tile.querySelector(".tileIcon").textContent="💎";

  sound("diamond");

  createParticles(tile);

  multiplier=
    calculateMultiplier();

  const potential=
    Math.floor(bet*multiplier);

  document.getElementById("roundWin").textContent=
    format(potential);

  showMessage(
    `💎 Diamond found • ${multiplier.toFixed(2)}x`
  );

  if(revealed >= 25-mines){

    cashOut();

    return;
  }

  updateUI();
}


/* =========================
   MULTIPLIER
========================= */

function calculateMultiplier(){

  const safeTotal=25-mines;

  let value=1;

  for(let i=0;i<revealed;i++){

    value*=
      (25-i)/(safeTotal-i);
  }

  return Math.max(1, value*.96);
}


/* =========================
   CASH OUT
========================= */

document.getElementById("cashBtn").onclick=()=>{
  cashOut();
};


function cashOut(){

  if(!gameActive || revealed<=0) return;

  const win=
    Math.floor(bet*multiplier);

  balance+=win;

  gameActive=false;

  sound("cash");

  createScreenParticles();

  document.getElementById("cashBtn")
    .disabled=true;

  document.getElementById("startBtn")
    .disabled=false;

  document.getElementById("betInput")
    .disabled=false;

  document.querySelectorAll(".mineBtn")
    .forEach(x=>x.disabled=false);

  document.getElementById("roundWin").textContent=
    format(win);

  document.getElementById("lastResult").textContent=
    "+"+format(win);

  showMessage(
    `CASHED OUT • ${format(win)} VIRTUAL COINS`,
    "win"
  );

  addHistory("💎",`${multiplier.toFixed(2)}x`);

  updateUI();
}


/* =========================
   REVEAL MINES
========================= */

function revealAllMines(){

  board.forEach((data,index)=>{

    if(data.mine){

      const tile=
        document.querySelectorAll(".tile")[index];

      tile.classList.add(
        "revealed",
        "bomb"
      );

      tile.querySelector(".tileIcon")
        .textContent="💣";

    }

  });
}


/* =========================
   PARTICLES
========================= */

function createParticles(tile){

  const rect=tile.getBoundingClientRect();

  for(let i=0;i<10;i++){

    const p=document.createElement("div");

    p.className="particle";

    p.style.left=
      rect.left+rect.width/2+"px";

    p.style.top=
      rect.top+rect.height/2+"px";

    p.style.background=
      i%2 ? "#20d47a" : "#ffc857";

    p.style.setProperty(
      "--x",
      (Math.random()*120-60)+"px"
    );

    p.style.setProperty(
      "--y",
      (Math.random()*-120-20)+"px"
    );

    document.body.appendChild(p);

    setTimeout(()=>p.remove(),850);
  }
}


function createScreenParticles(){

  for(let i=0;i<30;i++){

    const p=document.createElement("div");

    p.className="particle";

    p.style.left="50%";
    p.style.top="50%";

    p.style.background=
      i%2 ? "#20d47a" : "#ffc857";

    p.style.setProperty(
      "--x",
      (Math.random()*360-180)+"px"
    );

    p.style.setProperty(
      "--y",
      (Math.random()*360-180)+"px"
    );

    document.body.appendChild(p);

    setTimeout(()=>p.remove(),850);
  }
}


/* =========================
   HISTORY
========================= */

function addHistory(icon,text){

  const list=
    document.getElementById("historyList");

  const item=document.createElement("div");

  item.className="historyItem";

  item.innerHTML=`
    <div class="hIcon">${icon}</div>
    <div class="hText">${text}</div>
  `;

  list.prepend(item);

  while(list.children.length>8){
    list.lastChild.remove();
  }
}


/* =========================
   MESSAGE
========================= */

function showMessage(text,type=""){

  const el=
    document.getElementById("message");

  el.textContent=text;

  el.className="message "+type;
}


/* =========================
   UI
========================= */

function format(number){

  return Number(number).toLocaleString("en-IN");
}


function updateUI(){

  document.getElementById("balance")
    .textContent=format(balance);

  document.getElementById("currentBet")
    .textContent=format(bet);

  document.getElementById("multiplier")
    .textContent=
      multiplier.toFixed(2)+"x";

  document.getElementById("safeCount")
    .textContent=
      Math.max(0,25-mines-revealed);

}


/* =========================
   INITIAL
========================= */

buildBoard();

</script>

</body>
</html>
