<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050707">
<title>NOIRVA MINES</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#050707;
  --panel:#0d1111;
  --panel2:#111716;
  --line:#252d2a;
  --text:#f4f7f5;
  --muted:#75817c;
  --green:#19e39a;
  --red:#f04b5d;
  --gold:#e9c46a;
}

html{
  min-height:100%;
  scroll-behavior:smooth;
}

body{
  min-height:100%;
  overflow-x:hidden;
  overscroll-behavior:none;
  background:#050707;
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
  touch-action:manipulation;
}

.hidden{
  display:none!important;
}


/* =========================================
   BACKGROUND
========================================= */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-2;
  background:
    radial-gradient(
      circle at 50% -10%,
      #174a3850,
      transparent 38%
    ),
    radial-gradient(
      circle at 0% 100%,
      #073b2b25,
      transparent 30%
    ),
    #050707;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  opacity:.022;
  background-image:
    linear-gradient(#fff 1px,transparent 1px),
    linear-gradient(90deg,#fff 1px,transparent 1px);
  background-size:70px 70px;
}


/* =========================================
   LOGIN
========================================= */

.loginScreen{
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:20px;
}

.login{
  width:min(380px,100%);
  text-align:center;
}

.mark{
  width:64px;
  height:64px;
  margin:0 auto 17px;
  display:grid;
  place-items:center;
  border-radius:18px;

  background:
    radial-gradient(
      circle at 35% 20%,
      #29483d,
      #0c1311 67%
    );

  border:1px solid #ffffff18;

  box-shadow:
    0 22px 70px #000,
    inset 0 1px #ffffff16;

  font-size:28px;
  font-weight:950;
}

.brand{
  font-size:28px;
  font-weight:950;
  letter-spacing:8px;
}

.tag{
  margin-top:7px;
  color:#64706b;
  font-size:7px;
  letter-spacing:3px;
}

.loginBox{
  margin-top:30px;
  padding:21px;

  border-radius:17px;

  background:#0c1110ed;

  border:1px solid var(--line);

  box-shadow:
    0 30px 100px #000b;
}

.label{
  display:block;
  margin-bottom:7px;
  text-align:left;
  color:#75817c;
  font-size:8px;
  letter-spacing:2px;
}

.input{
  width:100%;
  height:49px;
  margin-bottom:15px;
  padding:0 13px;

  border-radius:9px;

  border:1px solid #252d2a;
  outline:none;

  background:#070a0a;
  color:#fff;

  transition:
    border-color .25s ease,
    box-shadow .25s ease;
}

.input:focus{
  border-color:#19e39a66;
  box-shadow:
    0 0 0 3px #19e39a0c;
}

.mainBtn{
  width:100%;
  height:50px;

  border:0;
  border-radius:9px;

  background:
    linear-gradient(
      180deg,
      #28eda6,
      #0fc983
    );

  color:#03140d;

  font-weight:950;
  letter-spacing:1px;

  box-shadow:
    0 10px 30px #19e39a18;

  transition:
    transform .18s ease,
    filter .25s ease;
}

.mainBtn:active{
  transform:scale(.985);
}

.error{
  min-height:18px;
  margin-top:8px;
  color:var(--red);
  font-size:10px;
}

.note{
  margin-top:13px;
  color:#59645f;
  font-size:8px;
  line-height:1.7;
}


/* =========================================
   HEADER
========================================= */

.header{
  height:58px;

  position:sticky;
  top:0;
  z-index:50;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    0
    max(9px,env(safe-area-inset-right))
    0
    max(9px,env(safe-area-inset-left));

  background:#070909e8;

  backdrop-filter:blur(22px);

  border-bottom:1px solid #202725;
}

.logo{
  font-size:13px;
  font-weight:950;
  letter-spacing:4px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:5px;
}

.balance{
  min-width:82px;
  height:34px;

  display:grid;
  place-items:center;

  padding:0 8px;

  border-radius:8px;

  border:1px solid #234336;

  background:#0b1712;

  color:var(--green);

  font-size:9px;
  font-weight:900;
}

.headBtn{
  height:34px;
  padding:0 8px;

  border-radius:8px;

  border:1px solid #252d2a;

  background:#111515;

  color:#89938f;

  font-size:7px;
  font-weight:750;

  transition:
    background .2s ease,
    border-color .2s ease,
    transform .15s ease;
}

.headBtn:active{
  transform:scale(.96);
}


/* =========================================
   PAGE
========================================= */

.page{
  width:min(760px,100%);
  margin:auto;

  padding:
    10px
    8px
    35px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:9px;
}

.back{
  padding:7px 0;

  border:0;
  background:none;

  color:#7e8985;

  font-size:9px;
}

.title{
  font-size:16px;
  font-weight:950;
}

.miniBalance{
  color:var(--green);
  font-size:9px;
  font-weight:900;
}


/* =========================================
   PANEL
========================================= */

.panel{
  margin-bottom:7px;

  padding:10px;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      #111716,
      #0a0e0e
    );

  border:1px solid var(--line);

  box-shadow:
    0 15px 45px #0005,
    inset 0 1px #ffffff04;
}


/* =========================================
   STATUS
========================================= */

.status{
  text-align:center;
  padding:5px 8px 8px;
}

.statusLabel{
  color:#68736f;
  font-size:7px;
  letter-spacing:2px;
}

.multiplier{
  margin-top:3px;

  font-size:34px;
  line-height:1;

  font-weight:950;
  letter-spacing:-2px;

  color:var(--green);

  text-shadow:
    0 0 28px #19e39a20;

  transition:
    color .35s ease,
    text-shadow .4s ease,
    transform .3s cubic-bezier(.22,.61,.36,1);
}

.multiplier.hot{
  color:var(--gold);

  text-shadow:
    0 0 30px #e9c46a35;
}

.statusText{
  min-height:18px;

  margin-top:5px;

  color:#75817c;

  font-size:8px;

  transition:
    color .25s ease;
}

.statusText.win{
  color:var(--green);
}

.statusText.loss{
  color:#ff7884;
}


/* =========================================
   BOARD FRAME
========================================= */

.boardFrame{
  padding:6px;

  border-radius:15px;

  background:
    linear-gradient(
      145deg,
      #303835,
      #080b0b 27%,
      #1b211f 75%,
      #070909
    );

  border:1px solid #39413e;

  box-shadow:
    0 24px 60px #000,
    inset 0 1px #ffffff13,
    inset 0 -2px #000;
}

.board{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:4px;

  padding:5px;

  border-radius:11px;

  background:
    radial-gradient(
      circle at 50% 20%,
      #17201d,
      #070909 75%
    );

  border:1px solid #161d1b;
}


/* =========================================
   TILE
========================================= */

.tile{
  position:relative;

  aspect-ratio:1;

  min-width:0;

  display:grid;
  place-items:center;

  border-radius:8px;

  border:1px solid #303936;

  background:
    linear-gradient(
      145deg,
      #202725,
      #121817 52%,
      #0b0f0f
    );

  box-shadow:
    inset 0 1px #ffffff09,
    inset 0 -5px 10px #0008,
    0 2px 4px #0008;

  overflow:hidden;

  transition:
    transform .22s cubic-bezier(.22,.61,.36,1),
    background .28s ease,
    border-color .28s ease,
    box-shadow .3s ease,
    filter .3s ease;
}

.tile::before{
  content:"";

  position:absolute;

  left:8%;
  right:8%;
  top:6%;

  height:38%;

  border-radius:50%;

  background:#ffffff06;

  filter:blur(4px);

  pointer-events:none;
}

.tile:active{
  transform:scale(.93);
}

.tile:not(.open):hover{
  border-color:#465b53;
}

.tile.open{
  animation:
    tileOpenSmooth
    .38s
    cubic-bezier(.16,1,.3,1);
}

@keyframes tileOpenSmooth{

  0%{
    transform:
      scale(.88)
      rotateX(12deg);

    opacity:.4;

    filter:brightness(.72);
  }

  55%{
    transform:
      scale(1.025)
      rotateX(0);

    opacity:1;

    filter:brightness(1.08);
  }

  100%{
    transform:
      scale(1)
      rotateX(0);

    opacity:1;

    filter:brightness(1);
  }

}


/* =========================================
   SAFE TILE
========================================= */

.tile.safe{

  background:
    radial-gradient(
      circle at 50% 42%,
      #1d6049,
      #0c2c21 57%,
      #06130f
    );

  border-color:#268262;

  box-shadow:
    inset 0 1px #ffffff10,
    inset 0 -7px 13px #0008,
    0 0 18px #19e39a12;
}


/* =========================================
   DIAMOND SVG
========================================= */

.diamondSVG{
  width:57%;
  height:57%;

  overflow:visible;

  filter:
    drop-shadow(0 2px 3px #000)
    drop-shadow(0 0 5px #5affc022);

  animation:
    diamondReveal
    .48s
    cubic-bezier(.16,1,.3,1);
}

@keyframes diamondReveal{

  0%{
    opacity:0;

    transform:
      scale(.55)
      rotate(-8deg);
  }

  55%{
    opacity:1;

    transform:
      scale(1.06)
      rotate(2deg);
  }

  100%{
    opacity:1;

    transform:
      scale(1)
      rotate(0);
  }

}

.diamondShine{
  animation:
    diamondShine
    2.2s
    ease-in-out
    infinite;
}

@keyframes diamondShine{

  0%,100%{
    opacity:.22;
  }

  50%{
    opacity:.85;
  }

}


/* =========================================
   BOMB TILE
========================================= */

.tile.bomb{

  background:
    radial-gradient(
      circle at 50% 40%,
      #762d39,
      #32151b 57%,
      #15090c
    );

  border-color:#a43f4d;

  box-shadow:
    inset 0 1px #ffffff0b,
    inset 0 -9px 15px #0009,
    0 0 30px #f04b5d25;
}

.bombSVG{
  width:58%;
  height:58%;

  overflow:visible;

  filter:
    drop-shadow(0 3px 4px #000)
    drop-shadow(0 0 6px #f04b5d20);

  animation:
    bombReveal
    .42s
    cubic-bezier(.16,1,.3,1);
}

@keyframes bombReveal{

  0%{
    opacity:0;
    transform:scale(.7);
  }

  65%{
    opacity:1;
    transform:scale(1.035);
  }

  100%{
    opacity:1;
    transform:scale(1);
  }

}


/* =========================================
   CONTROLS
========================================= */

.controls{
  display:grid;
  grid-template-columns:1fr;
  gap:6px;
}

.field{
  min-width:0;

  padding:8px;

  border-radius:9px;

  border:1px solid #252d2a;

  background:#080b0b;
}

.field label{
  display:block;

  margin-bottom:6px;

  color:#75817c;

  font-size:7px;
  letter-spacing:2px;
}

.field input{
  width:100%;
  height:28px;

  border:0;
  outline:0;

  background:none;

  color:white;

  font-size:14px;
  font-weight:900;
}

.quick{
  display:flex;
  gap:4px;
  margin-top:5px;
}

.quick button,
.bombOption{
  flex:1;

  min-width:0;

  height:31px;

  border-radius:6px;

  border:1px solid #2a3330;

  background:#171c1b;

  color:#929c98;

  font-size:8px;
  font-weight:800;

  transition:
    transform .15s ease,
    background .2s ease,
    border-color .2s ease,
    color .2s ease;
}

.quick button:active,
.bombOption:active{
  transform:scale(.95);
}

.bombOptions{
  display:flex;
  gap:4px;
}

.bombOption.active{
  background:#35171d;

  border-color:#87333f;

  color:#ff8490;
}


/* =========================================
   ACTION BUTTONS
========================================= */

.action{
  width:100%;

  min-height:46px;

  margin-top:7px;

  border:0;

  border-radius:9px;

  background:
    linear-gradient(
      180deg,
      #26eda6,
      #0fc983
    );

  color:#03140d;

  font-size:9px;

  font-weight:950;

  letter-spacing:1.1px;

  box-shadow:
    0 8px 25px #19e39a13;

  transition:
    transform .16s cubic-bezier(.22,.61,.36,1),
    filter .25s ease,
    box-shadow .3s ease;
}

.action:active{
  transform:scale(.985);
}

.action:disabled{
  opacity:.3;
  box-shadow:none;
}

.cash{
  background:
    linear-gradient(
      180deg,
      #efd184,
      #c69c40
    );

  color:#171006;
}

.cash.ready{
  animation:
    cashBreath
    2s
    ease-in-out
    infinite;
}

@keyframes cashBreath{

  0%,100%{
    box-shadow:
      0 0 10px #e9c46a12,
      0 6px 20px #0004;
  }

  50%{
    box-shadow:
      0 0 22px #e9c46a25,
      0 8px 24px #0005;
  }

}


/* =========================================
   STATS
========================================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:5px;
}

.stat{
  min-width:0;

  padding:9px 6px;

  border-radius:8px;

  background:#090c0c;

  border:1px solid #202725;

  text-align:center;
}

.stat strong{
  display:block;
  font-size:11px;
}

.stat span{
  display:block;

  margin-top:2px;

  color:#66716d;

  font-size:6px;

  letter-spacing:1px;
}


/* =========================================
   HISTORY
========================================= */

.history{
  display:flex;

  gap:5px;

  overflow-x:auto;

  scrollbar-width:none;
}

.history::-webkit-scrollbar{
  display:none;
}

.historyItem{
  flex:0 0 auto;

  min-width:56px;
  height:31px;

  padding:0 8px;

  display:grid;
  place-items:center;

  border-radius:7px;

  background:#171c1b;

  border:1px solid #272e2c;

  color:#818b87;

  font-size:7px;

  font-weight:850;
}

.historyItem.win{
  color:var(--green);

  background:#0c2b20;

  border-color:#185c44;
}

.historyItem.loss{
  color:#ff7884;

  background:#2b1217;

  border-color:#63252f;
}


/* =========================================
   RESULT
========================================= */

.resultFlash{
  position:fixed;
  inset:0;

  z-index:200;

  display:grid;
  place-items:center;

  pointer-events:none;

  opacity:0;
}

.resultCard{
  padding:22px 27px;

  border-radius:16px;

  background:#0c1110ee;

  border:1px solid #ffffff18;

  text-align:center;

  box-shadow:
    0 25px 80px #000,
    0 0 40px #19e39a08;

  transform:scale(.8);
}

.resultTitle{
  font-size:25px;
  font-weight:950;
}

.resultValue{
  margin-top:5px;

  color:var(--green);

  font-size:15px;
  font-weight:900;
}

.resultFlash.show{
  animation:
    flashSmooth
    1s
    ease-out;
}

.resultFlash.show .resultCard{
  animation:
    resultSmooth
    .75s
    cubic-bezier(.16,1,.3,1);
}

@keyframes flashSmooth{

  0%{
    opacity:0;
  }

  15%{
    opacity:1;
  }

  65%{
    opacity:1;
  }

  100%{
    opacity:0;
  }

}

@keyframes resultSmooth{

  0%{
    transform:
      scale(.86)
      translateY(8px);

    opacity:0;
  }

  55%{
    transform:
      scale(1.015)
      translateY(0);

    opacity:1;
  }

  100%{
    transform:
      scale(1)
      translateY(0);
  }

}


/* =========================================
   SHAKE
========================================= */

.shake{
  animation:
    softShake
    .42s
    cubic-bezier(.36,.07,.19,.97);
}

@keyframes softShake{

  0%,100%{
    transform:translateX(0);
  }

  20%{
    transform:translateX(-3px);
  }

  40%{
    transform:translateX(3px);
  }

  60%{
    transform:translateX(-2px);
  }

  80%{
    transform:translateX(1px);
  }

}


/* =========================================
   PARTICLES
========================================= */

.particle{
  position:fixed;

  width:4px;
  height:4px;

  border-radius:50%;

  background:var(--green);

  pointer-events:none;

  z-index:300;

  animation:
    particleSmooth
    1.05s
    cubic-bezier(.16,1,.3,1)
    forwards;
}

@keyframes particleSmooth{

  0%{
    transform:
      translate3d(0,0,0)
      scale(1);

    opacity:.85;
  }

  100%{
    transform:
      translate3d(var(--x),var(--y),0)
      scale(0);

    opacity:0;
  }

}


/* =========================================
   TABLET / DESKTOP
========================================= */

@media(min-width:650px){

  .page{
    padding-top:24px;
  }

  .controls{
    grid-template-columns:1fr 1fr;
  }

  .board{
    gap:7px;
    padding:7px;
  }

  .tile{
    border-radius:9px;
  }

}


/* =========================================
   SMALL PHONES
========================================= */

@media(max-width:390px){

  .logo{
    letter-spacing:3px;
  }

  .balance{
    min-width:76px;
  }

  .headBtn{
    padding:0 7px;
  }

  .page{
    padding-left:6px;
    padding-right:6px;
  }

  .panel{
    padding:8px;
    border-radius:13px;
  }

  .boardFrame{
    padding:5px;
  }

  .board{
    gap:3px;
    padding:4px;
  }

  .tile{
    border-radius:7px;
  }

  .diamondSVG,
  .bombSVG{
    width:55%;
    height:55%;
  }

  .multiplier{
    font-size:32px;
  }

}


/* =========================================
   VERY SMALL PHONES
========================================= */

@media(max-width:350px){

  .header{
    padding-left:7px;
    padding-right:7px;
  }

  .logo{
    font-size:12px;
    letter-spacing:3px;
  }

  .balance{
    min-width:69px;
    font-size:8px;
  }

  .headBtn{
    padding:0 6px;
    font-size:6px;
  }

  .page{
    padding-left:5px;
    padding-right:5px;
  }

  .panel{
    padding:7px;
  }

}

</style>
</head>


<body>


<!-- =========================================
     LOGIN
========================================= -->

<section
  id="loginScreen"
  class="loginScreen"
>

  <div class="login">

    <div class="mark">
      N
    </div>

    <div class="brand">
      NOIRVA
    </div>

    <div class="tag">
      MINES · VIRTUAL PLAYGROUND
    </div>


    <div class="loginBox">

      <label class="label">
        USERNAME
      </label>

      <input
        id="username"
        class="input"
        type="text"
        autocomplete="username"
        placeholder="Enter username"
      >


      <label class="label">
        PASSWORD
      </label>

      <input
        id="password"
        class="input"
        type="password"
        autocomplete="current-password"
        placeholder="Enter password"
      >


      <button
        class="mainBtn"
        onclick="login()"
      >
        ENTER NOIRVA
      </button>


      <div
        id="loginError"
        class="error"
      ></div>


      <div class="note">
        DEMO ACCESS · VIRTUAL COINS ONLY<br>
        NO REAL-MONEY WAGERING OR WITHDRAWALS
      </div>

    </div>

  </div>

</section>



<!-- =========================================
     GAME
========================================= -->

<section
  id="gameScreen"
  class="hidden"
>


<header class="header">

  <div class="logo">
    NOIRVA
  </div>


  <div class="headerRight">

    <div
      id="balance"
      class="balance"
    >
      10,000 ◈
    </div>


    <button
      id="soundBtn"
      class="headBtn"
      onclick="toggleSound()"
    >
      SOUND ON
    </button>


    <button
      class="headBtn"
      onclick="logout()"
    >
      EXIT
    </button>

  </div>

</header>



<main class="page">


  <div class="top">

    <button

/* =========================================
   AUDIO ENGINE
========================================= */

function initAudio(){

  try{

    if(!audioContext){

      audioContext=
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if(
      audioContext &&
      audioContext.state===
      "suspended"
    ){

      audioContext.resume();

    }

  }catch(e){}

}


/*
  Soft, warm synthesized sound.
  No harsh square-wave clicks.
*/

function tone(
  frequency,
  duration=.16,
  type="sine",
  volume=.035,
  delay=0,
  detune=0
){

  if(!state.sound)
    return;


  initAudio();


  if(!audioContext)
    return;


  const now=
    audioContext.currentTime+
    delay;


  const osc=
    audioContext.createOscillator();


  const gain=
    audioContext.createGain();


  const filter=
    audioContext.createBiquadFilter();


  osc.type=type;


  osc.frequency.setValueAtTime(
    frequency,
    now
  );


  osc.detune.setValueAtTime(
    detune,
    now
  );


  filter.type="lowpass";


  filter.frequency.setValueAtTime(
    Math.min(
      frequency*3,
      2600
    ),
    now
  );


  filter.Q.value=.35;


  gain.gain.setValueAtTime(
    .0001,
    now
  );


  gain.gain.exponentialRampToValueAtTime(
    volume,
    now+.035
  );


  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+duration
  );


  osc.connect(filter);

  filter.connect(gain);

  gain.connect(
    audioContext.destination
  );


  osc.start(now);


  osc.stop(
    now+
    duration+
    .04
  );

}

/* =========================================
   BUILD BOARD
========================================= */

function buildBoard(){

  const board=
    document.getElementById(
      "board"
    );


  board.innerHTML="";


  state.board=
    Array(25).fill(false);


  let placed=0;


  while(
    placed<
    state.bombs
  ){

    const index=
      Math.floor(
        Math.random()*25
      );


    if(
      !state.board[index]
    ){

      state.board[index]=true;

      placed++;

    }

  }


  for(
    let i=0;
    i<25;
    i++
  ){

    const tile=
      document.createElement(
        "button"
      );


    tile.className="tile";

    tile.type="button";

    tile.dataset.index=i;


    tile.innerHTML=`

      <span style="
        font-size:11px;
        color:#56615d;
        font-weight:900;
        opacity:.65;
      ">+</span>

    `;


    tile.addEventListener(
      "click",
      ()=>{
        revealTile(
          i,
          tile
        );
      }
    );


    board.appendChild(tile);

  }

}


/* =========================================
   START ROUND
========================================= */

function startRound(){

  if(state.active)
    return;


  const bet=
    validBet();


  if(!bet){

    showStatus(
      "Invalid bet or insufficient balance.",
      "loss"
    );

    return;

  }


  initAudio();


  state.active=true;

  state.bet=bet;

  state.revealed=0;

  state.multiplier=1;


  state.balance-=bet;


  updateBalance();


  buildBoard();


  document.getElementById(
    "startBtn"
  ).disabled=true;


  document.getElementById(
    "cashBtn"
  ).disabled=false;


  document.getElementById(
    "cashBtn"
  ).classList.remove(
    "ready"
  );


  document.getElementById(
    "cashBtn"
  ).textContent=
    "CASH OUT · 0 ◈";


  document.getElementById(
    "roundBet"
  ).textContent=
    money(bet);


  document.getElementById(
    "safeCount"
  ).textContent="0";


  document.getElementById(
    "potential"
  ).textContent="0 ◈";


  setMultiplier(1);


  showStatus(
    "Find the diamonds.",
    ""
  );


  uiClick();

}


/* =========================================
   REVEAL TILE
========================================= */

function revealTile(
  index,
  tile
){

  if(!state.active)
    return;


  if(
    tile.classList.contains(
      "open"
    )
  )
    return;


  tile.classList.add(
    "open"
  );


  /* ==============================
     BOMB
  ============================== */

  if(
    state.board[index]
  ){

    tile.classList.add(
      "bomb"
    );


    tile.innerHTML=
      bombSVG();


    revealBombs();


    state.active=false;


    document.getElementById(
      "cashBtn"
    ).disabled=true;


    bombSound();

    shakeBoard();


    showStatus(
      "BOOM · ROUND LOST",
      "loss"
    );


    addHistory(
      "−"+
      money(state.bet),
      false
    );


    showResult(
      "BOOM",
      "−"+
      money(state.bet),
      false
    );


    setTimeout(
      resetAfterRound,
      1100
    );


    return;

  }


  /* ==============================
     SAFE
  ============================== */

  tile.classList.add(
    "safe"
  );


  tile.innerHTML=
    diamondSVG();


  state.revealed++;


  state.multiplier=
    1+
    state.revealed*.15+
    Math.pow(
      state.revealed,
      1.45
    )*.018;


  setMultiplier(
    state.multiplier
  );


  const potential=
    Math.floor(
      state.bet*
      state.multiplier
    );


  document.getElementById(
    "safeCount"
  ).textContent=
    state.revealed;


  document.getElementById(
    "potential"
  ).textContent=
    money(potential);


  document.getElementById(
    "cashBtn"
  ).textContent=
    "CASH OUT · "+
    money(potential);


  document.getElementById(
    "cashBtn"
  ).classList.add(
    "ready"
  );


  diamondSound();


  if(
    state.revealed>=
    25-state.bombs
  ){

    cashOut();

  }

}


/* =========================================
   REVEAL BOMBS
========================================= */

function revealBombs(){

  const tiles=
    document.querySelectorAll(
      ".tile"
    );


  tiles.forEach(
    (tile,index)=>{

      if(
        state.board[index] &&
        !tile.classList.contains(
          "open"
        )
      ){

        tile.classList.add(
          "open",
          "bomb"
        );


        tile.innerHTML=
          bombSVG();

      }

    }
  );

}


/* =========================================
   CASH OUT
========================================= */

function cashOut(){

  if(!state.active)
    return;


  const payout=
    Math.floor(
      state.bet*
      state.multiplier
    );


  state.balance+=payout;


  updateBalance();


  state.active=false;


  document.getElementById(
    "cashBtn"
  ).disabled=true;


  document.getElementById(
    "cashBtn"
  ).classList.remove(
    "ready"
  );


  showStatus(
    "CASHED OUT · "+
    money(payout),
    "win"
  );


  addHistory(
    "+"+
    money(payout),
    true
  );


  cashSound();

  winSound();

  createParticles(30);


  showResult(
    "CASHED OUT",
    "+"+
    money(payout),
    true
  );


  setTimeout(
    resetAfterRound,
    1100
  );

}


/* =========================================
   RESET
========================================= */

function resetAfterRound(){

  state.active=false;

  state.revealed=0;

  state.multiplier=1;

  state.bet=0;


  buildBoard();


  document.getElementById(
    "startBtn"
  ).disabled=false;


  document.getElementById(
    "cashBtn"
  ).disabled=true;


  document.getElementById(
    "cashBtn"
  ).classList.remove(
    "ready"
  );


  document.getElementById(
    "cashBtn"
  ).textContent=
    "CASH OUT · 0 ◈";


  document.getElementById(
    "safeCount"
  ).textContent="0";


  document.getElementById(
    "roundBet"
  ).textContent="0 ◈";


  document.getElementById(
    "potential"
  ).textContent="0 ◈";


  setMultiplier(1);


  showStatus(
    "Choose your settings and start a round.",
    ""
  );

}


/* =========================================
   MULTIPLIER
========================================= */

function setMultiplier(
  value
){

  const element=
    document.getElementById(
      "multiplier"
    );


  element.textContent=
    value.toFixed(2)+
    "×";


  if(value>=2.5){

    element.classList.add(
      "hot"
    );

  }else{

    element.classList.remove(
      "hot"
    );

  }

}


/* =========================================
   STATUS
========================================= */

function showStatus(
  text,
  type
){

  const element=
    document.getElementById(
      "statusText"
    );


  element.textContent=text;


  element.className=
    "statusText "+
    (
      type==="win"
        ?"win"
        :
      type==="loss"
        ?"loss"
        :""
    );

}


/* =========================================
   HISTORY
========================================= */

function addHistory(
  text,
  isWin
){

  state.history.unshift({
    text:text,
    isWin:isWin
  });


  state.history=
    state.history.slice(
      0,
      10
    );


  renderHistory();

}


function renderHistory(){

  const element=
    document.getElementById(
      "history"
    );


  if(
    !state.history.length
  ){

    element.innerHTML=`

      <div class="historyItem">
        NO ROUNDS
      </div>

    `;

    return;

  }


  element.innerHTML=
    state.history
      .map(
        item=>`

          <div class="
            historyItem
            ${item.isWin?"win":"loss"}
          ">
            ${item.text}
          </div>

        `
      )
      .join("");

}


/* =========================================
   RESULT
========================================= */

function showResult(
  title,
  value,
  win
){

  const flash=
    document.getElementById(
      "resultFlash"
    );


  document.getElementById(
    "resultTitle"
  ).textContent=
    title;


  const valueElement=
    document.getElementById(
      "resultValue"
    );


  valueElement.textContent=
    value;


  valueElement.style.color=
    win
      ?"var(--green)"
      :"var(--red)";


  flash.classList.remove(
    "show"
  );


  void flash.offsetWidth;


  flash.classList.add(
    "show"
  );

}


/* =========================================
   SHAKE
========================================= */

function shakeBoard(){

  const panel=
    document.getElementById(
      "boardPanel"
    );


  panel.classList.remove(
    "shake"
  );


  void panel.offsetWidth;


  panel.classList.add(
    "shake"
  );

}


/* =========================================
   PARTICLES
========================================= */

function createParticles(
  count
){

  for(
    let i=0;
    i<count;
    i++
  ){

    const particle=
      document.createElement(
        "div"
      );


    particle.className=
      "particle";


    particle.style.left=
      (
        50+
        Math.random()*14-
        7
      )+
      "vw";


    particle.style.top=
      (
        45+
        Math.random()*12-
        6
      )+
      "vh";


    particle.style.setProperty(
      "--x",
      (
        Math.random()*400-
        200
      )+
      "px"
    );


    particle.style.setProperty(
      "--y",
      (
        -80-
        Math.random()*350
      )+
      "px"
    );


    document.body.appendChild(
      particle
    );


    setTimeout(
      ()=>{
        particle.remove();
      },
      1100
    );

  }

}


/* =========================================
   LOGIN ENTER KEY
========================================= */

document
  .getElementById(
    "password"
  )
  .addEventListener(
    "keydown",
    event=>{

      if(
        event.key==="Enter"
      ){

        login();

      }

    }
  );


/* =========================================
   INITIALIZE
========================================= */

updateSoundButton();


if(state.user){

  document
    .getElementById(
      "loginScreen"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "gameScreen"
    )
    .classList.remove(
      "hidden"
    );


  updateBalance();

  buildBoard();

}else{

  document
    .getElementById(
      "gameScreen"
    )
    .classList.add(
      "hidden"
    );

}


renderHistory();

</script>

</body>
</html>
