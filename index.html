<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NOIRVA • Mines</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#070809;
  --panel:#101214;
  --panel2:#151719;
  --line:#24282c;
  --text:#f5f5f5;
  --muted:#777d83;
  --soft:#aeb4ba;
  --accent:#dffcff;
  --green:#baffd2;
  --red:#ff8c8c;
  --gold:#e7d69d;
  --ease:cubic-bezier(.22,.75,.2,1);
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow:hidden;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  color:inherit;
}

.app{
  width:100%;
  height:100svh;
  overflow:hidden;
}

/* ================= LOGIN ================= */

.login{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:
    radial-gradient(circle at 50% 35%,#171b1d 0%,#090a0b 42%,#050606 100%);
}

.login-card{
  width:min(370px,100%);
  padding:30px 24px 24px;
  border:1px solid #25292d;
  border-radius:20px;
  background:rgba(15,17,19,.94);
  box-shadow:0 30px 80px rgba(0,0,0,.5);
}

.logo{
  text-align:center;
  font-size:25px;
  font-weight:800;
  letter-spacing:.22em;
}

.logo-sub{
  margin-top:5px;
  text-align:center;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.login-card input{
  width:100%;
  height:44px;
  margin-top:10px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:10px;
  outline:none;
  background:#0a0c0d;
  color:white;
}

.login-card input:focus{
  border-color:#555c62;
}

.login-btn{
  width:100%;
  height:44px;
  margin-top:14px;
  border-radius:10px;
  background:#f1f3f4;
  color:#090a0b;
  font-weight:750;
  cursor:pointer;
}

.demo{
  margin-top:11px;
  text-align:center;
  color:#666c71;
  font-size:10px;
}

/* ================= HEADER ================= */

.header{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 13px;
  border-bottom:1px solid #191c1f;
  background:rgba(7,8,9,.96);
}

.brand{
  font-size:15px;
  font-weight:850;
  letter-spacing:.18em;
}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.balance{
  height:29px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:0 9px;
  border:1px solid #25292c;
  border-radius:8px;
  background:#111315;
  color:#d9dde0;
  font-size:11px;
  font-weight:700;
}

.coin{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#e6e1c6;
  box-shadow:0 0 9px rgba(230,225,198,.35);
}

.sound-btn{
  width:29px;
  height:29px;
  border:1px solid #25292c;
  border-radius:8px;
  background:#111315;
  color:#aaa;
  cursor:pointer;
  font-size:12px;
}

/* ================= MAIN ================= */

.page{
  width:min(900px,100%);
  height:calc(100svh - 52px);
  margin:auto;
  padding:7px 9px 8px;
  overflow:hidden;
}

/* top row */

.top{
  height:25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:5px;
}

.game-name{
  font-size:13px;
  font-weight:750;
}

.game-tag{
  color:#686e73;
  font-size:9px;
  letter-spacing:.1em;
  text-transform:uppercase;
}

/* ================= STATUS ================= */

.status{
  height:59px;
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  padding:7px 11px;
  margin-bottom:6px;
  border:1px solid var(--line);
  border-radius:12px;
  background:linear-gradient(145deg,#111416,#0d0f10);
}

.status-left{
  min-width:0;
}

.status-label{
  color:#686f75;
  font-size:8px;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.status-text{
  margin-top:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:11px;
  font-weight:600;
}

.multiplier{
  min-width:68px;
  text-align:right;
  font-size:26px;
  line-height:1;
  font-weight:800;
  letter-spacing:-.04em;
  color:#f4f6f7;
  text-shadow:0 0 20px rgba(220,250,255,.08);
}

/* ================= BOARD ================= */

.board-panel{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  height:var(--board-height,39svh);
  min-height:250px;
  max-height:335px;
  padding:5px;
  margin-bottom:6px;
  border:1px solid var(--line);
  border-radius:14px;
  background:
    radial-gradient(circle at 50% 45%,rgba(255,255,255,.018),transparent 55%),
    #0d0f10;
}

.board{
  width:min(100%,335px);
  height:min(100%,335px);
  aspect-ratio:1;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  padding:5px;
  border-radius:12px;
  background:#090a0b;
  box-shadow:
    inset 0 0 0 1px #1d2023,
    0 12px 35px rgba(0,0,0,.28);
}

.tile{
  position:relative;
  min-width:0;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #25292d;
  border-radius:8px;
  background:
    linear-gradient(145deg,#181b1d,#101214);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025),
    0 3px 7px rgba(0,0,0,.22);
  cursor:pointer;
  overflow:hidden;
  transform:translateZ(0);
  transition:
    transform .28s var(--ease),
    background .3s ease,
    border-color .3s ease,
    box-shadow .3s ease,
    opacity .25s ease;
}

.tile::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    125deg,
    transparent 25%,
    rgba(255,255,255,.055) 50%,
    transparent 75%
  );
  transform:translateX(-130%);
  transition:transform .65s ease;
}

.tile:not(.disabled):active{
  transform:scale(.92);
}

.tile:not(.revealed):hover{
  border-color:#3c4247;
  transform:translateY(-1px);
}

.tile:hover::before{
  transform:translateX(130%);
}

.tile.revealed{
  background:
    radial-gradient(circle at 50% 45%,#263238,#14181a 70%);
  border-color:#4b646b;
  box-shadow:
    inset 0 0 18px rgba(170,240,255,.055),
    0 0 13px rgba(150,220,240,.05);
  animation:reveal .38s var(--ease);
}

.tile.bomb{
  background:
    radial-gradient(circle,#3b1e20,#181214 70%);
  border-color:#6e3438;
  animation:bombPop .42s var(--ease);
}

.tile.disabled{
  cursor:default;
}

.tile.lost{
  opacity:.75;
}

.tile svg{
  width:52%;
  height:52%;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));
}

.diamond{
  animation:diamondIn .42s var(--ease);
}

.bomb-svg{
  animation:bombIn .42s var(--ease);
}

@keyframes reveal{
  0%{transform:scale(.82);opacity:.4}
  65%{transform:scale(1.04)}
  100%{transform:scale(1);opacity:1}
}

@keyframes diamondIn{
  0%{transform:scale(.35) rotate(-15deg);opacity:0}
  65%{transform:scale(1.12) rotate(3deg)}
  100%{transform:scale(1) rotate(0);opacity:1}
}

@keyframes bombIn{
  0%{transform:scale(.3) rotate(-20deg);opacity:0}
  60%{transform:scale(1.13) rotate(4deg)}
  100%{transform:scale(1);opacity:1}
}

@keyframes bombPop{
  0%{transform:scale(.88)}
  45%{transform:scale(1.04)}
  100%{transform:scale(1)}
}

/* ================= CONTROLS ================= */

.controls{
  padding:7px;
  margin-bottom:6px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#101214;
}

.control-row{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:6px;
}

.field{
  min-width:0;
}

.field-label{
  display:block;
  margin:0 0 3px 2px;
  color:#696f74;
  font-size:8px;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.input-wrap{
  position:relative;
}

.input{
  width:100%;
  height:34px;
  padding:0 10px;
  border:1px solid #292d31;
  border-radius:8px;
  outline:none;
  background:#0a0c0d;
  color:#f5f5f5;
  font-size:11px;
  font-weight:650;
}

.input:focus{
  border-color:#555d63;
}

.quick{
  display:flex;
  gap:3px;
  position:absolute;
  right:3px;
  top:3px;
}

.quick button{
  height:28px;
  min-width:27px;
  padding:0 5px;
  border-radius:6px;
  background:#181b1d;
  color:#8f969b;
  font-size:8px;
  cursor:pointer;
}

.quick button:active{
  transform:scale(.94);
}

.bombs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
}

.bomb-choice{
  height:34px;
  border:1px solid #292d31;
  border-radius:8px;
  background:#0b0d0e;
  color:#8b9298;
  font-size:10px;
  font-weight:700;
  cursor:pointer;
  transition:.2s ease;
}

.bomb-choice.active{
  background:#e8ecee;
  border-color:#e8ecee;
  color:#08090a;
}

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:6px;
}

.action{
  height:38px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  transition:
    transform .18s ease,
    opacity .2s ease,
    filter .2s ease;
}

.action:active{
  transform:scale(.975);
}

.start{
  background:#eceff0;
  color:#08090a;
}

.cash{
  background:#191d1f;
  border:1px solid #30353a;
  color:#cdd2d5;
}

.cash:not(:disabled){
  border-color:#6d777d;
  box-shadow:0 0 18px rgba(210,240,245,.035);
}

.action:disabled{
  opacity:.32;
  cursor:not-allowed;
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:6px;
}

.stat{
  min-width:0;
  height:42px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 9px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0f1113;
}

.stat-label{
  color:#656c72;
  font-size:7px;
  letter-spacing:.09em;
  text-transform:uppercase;
}

.stat-value{
  margin-top:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:11px;
  font-weight:750;
}

/* ================= HISTORY ================= */

.history{
  height:34px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:4px 7px;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:10px;
  background:#0d0f10;
}

.history-title{
  flex:0 0 auto;
  color:#656b70;
  font-size:7px;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.history-list{
  min-width:0;
  display:flex;
  gap:4px;
  overflow:hidden;
}

.history-item{
  flex:0 0 auto;
  height:23px;
  display:flex;
  align-items:center;
  padding:0 7px;
  border-radius:6px;
  background:#16191b;
  font-size:8px;
  color:#9ca2a7;
}

.history-item.win{
  color:var(--green);
}

.history-item.loss{
  color:var(--red);
}

/* ================= EFFECTS ================= */

.result-flash{
  position:fixed;
  inset:0;
  z-index:40;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(circle at center,rgba(255,255,255,.08),transparent 50%);
}

.result-flash.show{
  animation:flash .7s ease;
}

@keyframes flash{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:0}
}

.shake{
  animation:shake .38s ease;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-5px)}
  40%{transform:translateX(5px)}
  60%{transform:translateX(-3px)}
  80%{transform:translateX(3px)}
}

.particle{
  position:fixed;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#e9faff;
  pointer-events:none;
  z-index:80;
  animation:particle .8s ease-out forwards;
}

@keyframes particle{
  from{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  to{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

/* ================= DESKTOP ================= */

@media(min-width:700px){

  .header{
    height:64px;
    padding:0 24px;
  }

  .brand{
    font-size:17px;
  }

  .page{
    height:calc(100svh - 64px);
    padding:16px 16px 20px;
  }

  .top{
    height:30px;
    margin-bottom:8px;
  }

  .game-name{
    font-size:15px;
  }

  .status{
    height:72px;
    margin-bottom:8px;
    padding:10px 15px;
  }

  .multiplier{
    font-size:32px;
  }

  .board-panel{
    height:min(42svh,390px);
    max-height:390px;
    margin-bottom:8px;
  }

  .board{
    width:min(100%,370px);
    height:min(100%,370px);
    gap:6px;
    padding:6px;
  }

  .controls{
    padding:10px;
    margin-bottom:8px;
  }

  .input,
  .bomb-choice{
    height:38px;
  }

  .action{
    height:42px;
  }

  .stats{
    margin-bottom:8px;
  }

  .stat{
    height:48px;
  }

  .history{
    height:40px;
  }
}

/* ================= SHORT PHONES ================= */

@media(max-height:700px) and (max-width:699px){

  .header{
    height:47px;
  }

  .page{
    height:calc(100svh - 47px);
    padding:5px 7px;
  }

  .top{
    height:21px;
    margin-bottom:3px;
  }

  .status{
    height:51px;
    margin-bottom:4px;
  }

  .multiplier{
    font-size:23px;
  }

  .board-panel{
    --board-height:35svh;
    min-height:225px;
    max-height:270px;
    margin-bottom:4px;
  }

  .board{
    width:min(100%,270px);
    height:min(100%,270px);
    gap:4px;
    padding:4px;
  }

  .tile{
    border-radius:6px;
  }

  .controls{
    padding:5px;
    margin-bottom:4px;
  }

  .field-label{
    margin-bottom:2px;
  }

  .input,
  .bomb-choice{
    height:31px;
  }

  .quick button{
    height:25px;
  }

  .action-row{
    margin-top:4px;
  }

  .action{
    height:34px;
  }

  .stats{
    gap:4px;
    margin-bottom:4px;
  }

  .stat{
    height:36px;
    padding:0 7px;
  }

  .history{
    height:29px;
  }

  .history-item{
    height:20px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- LOGIN -->
  <section class="login" id="loginScreen">
    <div class="login-card">
      <div class="logo">NOIRVA</div>
      <div class="logo-sub">Virtual Mines</div>

      <input id="username" type="text" placeholder="Username" autocomplete="off">
      <input id="password" type="password" placeholder="Password">

      <button class="login-btn" onclick="login()">ENTER</button>

      <div class="demo">
        Demo mode • Virtual coins only
      </div>
    </div>
  </section>

  <!-- HEADER -->
  <header class="header">
    <div class="brand">NOIRVA</div>

    <div class="header-right">
      <div class="balance">
        <span class="coin"></span>
        <span id="balance">10,000</span>
      </div>

      <button class="sound-btn" id="soundBtn" onclick="toggleSound()">♪</button>
    </div>
  </header>

  <!-- PAGE -->
  <main class="page">

    <div class="top">
      <div class="game-name">Mines</div>
      <div class="game-tag">5 × 5 board</div>
    </div>

    <!-- STATUS -->
    <section class="status">
      <div class="status-left">
        <div class="status-label">Round status</div>
        <div class="status-text" id="statusText">
          Choose your settings and start a round
        </div>
      </div>

      <div class="multiplier" id="multiplier">1.00×</div>
    </section>

    <!-- BOARD -->
    <section class="board-panel" id="boardPanel">
      <div class="board" id="board"></div>
    </section>

    <!-- CONTROLS -->
    <section class="controls">

      <div class="control-row">

        <div class="field">
          <label class="field-label">Bet</label>

          <div class="input-wrap">
            <input
              class="input"
              id="bet"
              type="number"
              inputmode="decimal"
              min="1"
              value="100"
            >

            <div class="quick">
              <button onclick="setBet(50)">50</button>
              <button onclick="setBet(100)">100</button>
              <button onclick="setBet(500)">500</button>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Mines</label>

          <div class="bombs">
            <button class="bomb-choice" data-bombs="3" onclick="setBombs(3)">3</button>
            <button class="bomb-choice active" data-bombs="5" onclick="setBombs(5)">5</button>
            <button class="bomb-choice" data-bombs="8" onclick="setBombs(8)">8</button>
          </div>
        </div>

      </div>

      <div class="action-row">
        <button class="action start" id="startBtn" onclick="startRound()">
          START ROUND
        </button>

        <button class="action cash" id="cashBtn" onclick="cashOut()" disabled>
          CASH OUT
        </button>
      </div>

    </section>

    <!-- STATS -->
    <section class="stats">

      <div class="stat">
        <div class="stat-label">Bet</div>
        <div class="stat-value" id="statBet">100</div>
      </div>

      <div class="stat">
        <div class="stat-label">Safe</div>
        <div class="stat-value" id="statSafe">0 / 20</div>
      </div>

      <div class="stat">
        <div class="stat-label">Potential</div>
        <div class="stat-value" id="statPotential">100</div>
      </div>

    </section>

    <!-- HISTORY -->
    <section class="history">

      <div class="history-title">Recent</div>

      <div class="history-list" id="historyList">
        <div class="history-item">No rounds yet</div>
      </div>

    </section>

  </main>

</div>

<div class="result-flash" id="flash"></div>

<script>
/* =========================================================
   NOIRVA MINES
   Virtual-money demo only
========================================================= */

const TOTAL_TILES = 25;

let state = {
  user: localStorage.getItem("noirva_user") || "",
  balance: Number(localStorage.getItem("noirva_balance") || 10000),
  sound: localStorage.getItem("noirva_sound") !== "off",

  bombs: 5,
  active: false,
  bet: 100,
  revealed: 0,
  multiplier: 1,
  board: [],
  history: []
};

let audioCtx = null;

/* ================= INIT ================= */

document.addEventListener("DOMContentLoaded", () => {

  updateBalance();
  updateSoundButton();

  if(state.user){
    document.getElementById("loginScreen").style.display = "none";
  }

  createBoard();
  updateUI();

  document.getElementById("bet").addEventListener("input", () => {
    const value = Number(document.getElementById("bet").value) || 0;
    document.getElementById("statBet").textContent = format(value);
    updatePotential();
  });
});

/* ================= LOGIN ================= */

function login(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  if(!username){
    alert("Enter a username.");
    return;
  }

  if(password.length < 3){
    alert("Password must contain at least 3 characters.");
    return;
  }

  state.user = username;

  localStorage.setItem("noirva_user", username);

  document.getElementById("loginScreen").style.display = "none";

  softTone(420,0.08);
}

/* ================= BOARD ================= */

function createBoard(){

  const board = document.getElementById("board");

  board.innerHTML = "";

  for(let i=0;i<TOTAL_TILES;i++){

    const tile = document.createElement("button");

    tile.className = "tile";
    tile.dataset.index = i;

    tile.onclick = () => revealTile(i);

    board.appendChild(tile);
  }
}

/* ================= RANDOM BOARD ================= */

function generateBombs(){

  const positions = [];

  while(positions.length < state.bombs){

    const index =
      Math.floor(Math.random() * TOTAL_TILES);

    if(!positions.includes(index)){
      positions.push(index);
    }
  }

  return positions;
}

/* ================= START ================= */

function startRound(){

  if(state.active) return;

  const betInput =
    document.getElementById("bet");

  const bet =
    Math.floor(Number(betInput.value));

  if(!Number.isFinite(bet) || bet <= 0){
    showStatus("Enter a valid bet.");
    return;
  }

  if(bet > state.balance){
    showStatus("Insufficient virtual balance.");
    softTone(150,0.08);
    return;
  }

  state.bet = bet;
  state.balance -= bet;

  state.active = true;
  state.revealed = 0;
  state.multiplier = 1;

  state.board = generateBombs();

  document.querySelectorAll(".tile").forEach(tile => {

    tile.className = "tile";
    tile.innerHTML = "";

  });

  document.getElementById("startBtn").disabled = true;
  document.getElementById("cashBtn").disabled = true;

  updateBalance();
  updateUI();

  showStatus("Round started. Pick a tile.");

  softTone(380,0.12);
}

/* ================= REVEAL ================= */

function revealTile(index){

  if(!state.active) return;

  const tile =
    document.querySelectorAll(".tile")[index];

  if(
    tile.classList.contains("revealed") ||
    tile.classList.contains("bomb")
  ){
    return;
  }

  if(state.board.includes(index)){

    tile.classList.add("bomb");

    tile.innerHTML = bombSVG();

    revealAllBombs();

    state.active = false;

    document.getElementById("cashBtn").disabled = true;
    document.getElementById("startBtn").disabled = true;

    showStatus("Mine hit. Round lost.");

    addHistory(
      "−" + format(state.bet),
      "loss"
    );

    showResult(false);
    shakeBoard();

    softBombSound();

    setTimeout(() => {
      document.getElementById("startBtn").disabled = false;
      resetRound();
    },1100);

    return;
  }

  state.revealed++;

  tile.classList.add("revealed");
  tile.innerHTML = diamondSVG();

  updateMultiplier();

  document.getElementById("cashBtn").disabled = false;

  showStatus(
    state.revealed === TOTAL_TILES - state.bombs
      ? "All safe tiles found."
      : "Safe tile. Keep going or cash out."
  );

  softWinSound();

  createParticles(tile);

  if(state.revealed === TOTAL_TILES - state.bombs){

    cashOut(true);
  }
}

/* ================= BOMBS ================= */

function revealAllBombs(){

  document.querySelectorAll(".tile").forEach((tile,index) => {

    tile.classList.add("disabled");

    if(state.board.includes(index)){

      tile.classList.add("bomb");

      tile.innerHTML = bombSVG();
    }
  });
}

/* ================= MULTIPLIER ================= */

function updateMultiplier(){

  /*
    Simple demo multiplier.
    No real-money wagering or payout.
  */

  state.multiplier =
    1 +
    state.revealed * 0.15 +
    Math.pow(state.revealed,1.45) * 0.018;

  setMultiplier(state.multiplier);

  updatePotential();
}

/* ================= CASH OUT ================= */

function cashOut(auto = false){

  if(!state.active) return;

  const payout =
    Math.floor(state.bet * state.multiplier);

  state.balance += payout;

  state.active = false;

  document.getElementById("cashBtn").disabled = true;
  document.getElementById("startBtn").disabled = true;

  showStatus(
    auto
      ? "Board cleared. Round complete."
      : "Cashed out successfully."
  );

  addHistory(
    "+" + format(payout),
    "win"
  );

  showResult(true);

  softCashSound();
  createWinParticles();

  updateBalance();

  setTimeout(() => {

    document.getElementById("startBtn").disabled = false;

    resetRound();

  },1100);
}

/* ================= RESET ================= */

function resetRound(){

  state.revealed = 0;
  state.multiplier = 1;
  state.board = [];

  setMultiplier(1);

  document.getElementById("statSafe").textContent =
    "0 / " + (TOTAL_TILES - state.bombs);

  document.getElementById("statPotential").textContent =
    format(state.bet);

  document.querySelectorAll(".tile").forEach(tile => {

    tile.className = "tile";
    tile.innerHTML = "";

  });

  showStatus("Choose a tile to begin a new round.");
}

/* ================= BOMBS SELECT ================= */

function setBombs(value){

  if(state.active) return;

  state.bombs = value;

  document.querySelectorAll(".bomb-choice")
    .forEach(button => {

      button.classList.toggle(
        "active",
        Number(button.dataset.bombs) === value
      );

    });

  document.getElementById("statSafe").textContent =
    "0 / " + (TOTAL_TILES - state.bombs);

  softTone(300,0.06);
}

/* ================= BET ================= */

function setBet(value){

  if(state.active) return;

  document.getElementById("bet").value = value;
  document.getElementById("statBet").textContent = format(value);

  updatePotential();

  softTone(330,0.05);
}

/* ================= UI ================= */

function updateUI(){

  document.getElementById("statBet").textContent =
    format(state.bet);

  document.getElementById("statSafe").textContent =
    "0 / " + (TOTAL_TILES - state.bombs);

  document.getElementById("statPotential").textContent =
    format(state.bet);

  setMultiplier(1);
}

function updatePotential(){

  const value =
    Number(document.getElementById("bet").value) || 0;

  const potential =
    Math.floor(value * state.multiplier);

  document.getElementById("statPotential").textContent =
    format(potential);
}

function updateBalance(){

  document.getElementById("balance").textContent =
    format(state.balance);

  localStorage.setItem(
    "noirva_balance",
    state.balance
  );
}

function setMultiplier(value){

  document.getElementById("multiplier").textContent =
    value.toFixed(2) + "×";
}

function showStatus(text){

  document.getElementById("statusText").textContent =
    text;
}

function format(value){

  return Number(value).toLocaleString("en-IN");
}

/* ================= HISTORY ================= */

function addHistory(text,type){

  state.history.unshift({
    text,
    type
  });

  state.history =
    state.history.slice(0,5);

  renderHistory();
}

function renderHistory(){

  const list =
    document.getElementById("historyList");

  list.innerHTML = "";

  if(!state.history.length){

    list.innerHTML =
      '<div class="history-item">No rounds yet</div>';

    return;
  }

  state.history.forEach(item => {

    const div =
      document.createElement("div");

    div.className =
      "history-item " + item.type;

    div.textContent = item.text;

    list.appendChild(div);
  });
}

/* ================= VISUAL EFFECTS ================= */

function showResult(win){

  const flash =
    document.getElementById("flash");

  flash.classList.remove("show");

  void flash.offsetWidth;

  flash.classList.add("show");
}

function shakeBoard(){

  const board =
    document.getElementById("boardPanel");

  board.classList.remove("shake");

  void board.offsetWidth;

  board.classList.add("shake");
}

function createParticles(element){

  const rect =
    element.getBoundingClientRect();

  for(let i=0;i<7;i++){

    const particle =
      document.createElement("div");

    particle.className = "particle";

    particle.style.left =
      (rect.left + rect.width / 2) + "px";

    particle.style.top =
      (rect.top + rect.height / 2) + "px";

    particle.style.setProperty(
      "--x",
      ((Math.random() - .5) * 80) + "px"
    );

    particle.style.setProperty(
      "--y",
      ((Math.random() - .5) * 80) + "px"
    );

    document.body.appendChild(particle);

    setTimeout(() => particle.remove(),850);
  }
}

function createWinParticles(){

  const board =
    document.getElementById("boardPanel");

  const rect =
    board.getBoundingClientRect();

  for(let i=0;i<18;i++){

    const particle =
      document.createElement("div");

    particle.className = "particle";

    particle.style.left =
      (rect.left + rect.width / 2) + "px";

    particle.style.top =
      (rect.top + rect.height / 2) + "px";

    particle.style.setProperty(
      "--x",
      ((Math.random() - .5) * 220) + "px"
    );

    particle.style.setProperty(
      "--y",
      ((Math.random() - .5) * 180) + "px"
    );

    document.body.appendChild(particle);

    setTimeout(() => particle.remove(),850);
  }
}

/* ================= SOUND ================= */

function initAudio(){

  if(!state.sound) return;

  if(!audioCtx){

    audioCtx =
      new (window.AudioContext ||
           window.webkitAudioContext)();
  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}

function softTone(freq,duration){

  if(!state.sound) return;

  initAudio();

  if(!audioCtx) return;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  const filter =
    audioCtx.createBiquadFilter();

  osc.type = "sine";
  osc.frequency.value = freq;

  filter.type = "lowpass";
  filter.frequency.value = 1800;

  gain.gain.setValueAtTime(
    0.0001,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.045,
    audioCtx.currentTime + .025
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audioCtx.currentTime + duration
  );

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime + duration + .03
  );
}

function softWinSound(){

  softTone(470,.13);

  setTimeout(() => {
    softTone(690,.18);
  },45);
}

function softCashSound(){

  softTone(420,.12);

  setTimeout(() => {
    softTone(560,.13);
  },55);

  setTimeout(() => {
    softTone(760,.2);
  },115);
}

function softBombSound(){

  if(!state.sound) return;

  initAudio();

  if(!audioCtx) return;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  const filter =
    audioCtx.createBiquadFilter();

  osc.type = "triangle";

  osc.frequency.setValueAtTime(
    130,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    48,
    audioCtx.currentTime + .28
  );

  filter.type = "lowpass";
  filter.frequency.value = 900;

  gain.gain.setValueAtTime(
    .0001,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .08,
    audioCtx.currentTime + .02
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    audioCtx.currentTime + .35
  );

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime + .38
  );
}

/* ================= SOUND TOGGLE ================= */

function toggleSound(){

  state.sound = !state.sound;

  localStorage.setItem(
    "noirva_sound",
    state.sound ? "on" : "off"
  );

  updateSoundButton();

  if(state.sound){
    softTone(500,.08);
  }
}

function updateSoundButton(){

  document.getElementById("soundBtn").textContent =
    state.sound ? "♪" : "×";
}
