<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050707">
<title>NOIRVA MINES</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#050707;
  --panel:#0d1111;
  --panel2:#111716;
  --line:#252d2a;
  --text:#f4f7f5;
  --muted:#75817c;
  --green:#19e39a;
  --green2:#0aa86e;
  --red:#f04b5d;
  --gold:#e9c46a;
  --blue:#8ee7ff;
}

html,body{
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
  overscroll-behavior-x:none;
  padding-bottom:env(safe-area-inset-bottom);
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
  touch-action:manipulation;
}

.hidden{
  display:none!important;
}

/* BACKGROUND */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-2;
  background:
    radial-gradient(circle at 50% -10%,#164f3b55,transparent 38%),
    radial-gradient(circle at 0% 100%,#063a2a30,transparent 30%),
    #050707;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  opacity:.025;
  background-image:
    linear-gradient(#fff 1px,transparent 1px),
    linear-gradient(90deg,#fff 1px,transparent 1px);
  background-size:70px 70px;
}

/* LOGIN */

.loginScreen{
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:20px;
}

.login{
  width:min(390px,100%);
  text-align:center;
}

.mark{
  width:68px;
  height:68px;
  margin:0 auto 18px;
  display:grid;
  place-items:center;
  border-radius:19px;
  background:
    radial-gradient(circle at 35% 20%,#29483d,#0d1412 65%);
  border:1px solid #ffffff18;
  box-shadow:
    0 25px 80px #000,
    inset 0 1px #ffffff18;
  font-size:29px;
  font-weight:950;
}

.brand{
  font-size:29px;
  font-weight:950;
  letter-spacing:8px;
}

.tag{
  margin-top:8px;
  color:#64706b;
  font-size:8px;
  letter-spacing:3px;
}

.loginBox{
  margin-top:32px;
  padding:23px;
  border-radius:18px;
  background:#0c1110ee;
  border:1px solid var(--line);
  box-shadow:0 30px 100px #000b;
}

.label{
  display:block;
  margin-bottom:8px;
  text-align:left;
  color:#75817c;
  font-size:8px;
  letter-spacing:2px;
}

.input{
  width:100%;
  height:51px;
  margin-bottom:16px;
  padding:0 14px;
  border-radius:9px;
  border:1px solid #252d2a;
  outline:none;
  background:#070a0a;
  color:#fff;
}

.input:focus{
  border-color:#19e39a66;
  box-shadow:0 0 0 3px #19e39a0d;
}

.mainBtn{
  width:100%;
  height:52px;
  border:0;
  border-radius:10px;
  background:linear-gradient(180deg,#28eda6,#0fc983);
  color:#03140d;
  font-weight:950;
  letter-spacing:1px;
  box-shadow:0 12px 35px #19e39a20;
}

.error{
  min-height:18px;
  margin-top:9px;
  color:var(--red);
  font-size:10px;
}

.note{
  margin-top:14px;
  color:#59645f;
  font-size:8px;
  line-height:1.7;
}

/* HEADER */

.header{
  height:64px;
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:
    0 12px
    max(12px,env(safe-area-inset-right))
    0
    max(12px,env(safe-area-inset-left));
  background:#070909e8;
  backdrop-filter:blur(22px);
  border-bottom:1px solid #202725;
}

.logo{
  font-size:14px;
  font-weight:950;
  letter-spacing:4px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:6px;
}

.balance{
  min-width:92px;
  height:37px;
  display:grid;
  place-items:center;
  padding:0 9px;
  border-radius:8px;
  border:1px solid #234336;
  background:#0b1712;
  color:var(--green);
  font-size:10px;
  font-weight:900;
}

.headBtn{
  min-width:40px;
  height:37px;
  padding:0 9px;
  border-radius:8px;
  border:1px solid #252d2a;
  background:#111515;
  color:#89938f;
  font-size:8px;
  font-weight:700;
}

/* PAGE */

.page{
  width:min(900px,100%);
  margin:auto;
  padding:16px 10px 50px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.back{
  border:0;
  background:none;
  color:#7e8985;
  font-size:10px;
  padding:8px 0;
}

.title{
  font-size:17px;
  font-weight:950;
}

.miniBalance{
  color:var(--green);
  font-size:10px;
  font-weight:900;
}

/* PANELS */

.panel{
  margin-bottom:9px;
  padding:13px;
  border-radius:16px;
  background:
    linear-gradient(145deg,#111716,#0a0e0e);
  border:1px solid var(--line);
  box-shadow:
    0 18px 55px #0006,
    inset 0 1px #ffffff05;
}

/* STATUS */

.status{
  text-align:center;
  padding:6px 10px 10px;
}

.statusLabel{
  color:#68736f;
  font-size:8px;
  letter-spacing:2px;
}

.multiplier{
  margin-top:3px;
  font-size:40px;
  line-height:1;
  font-weight:950;
  letter-spacing:-2px;
  color:var(--green);
  text-shadow:0 0 30px #19e39a25;
  transition:.2s;
}

.multiplier.hot{
  color:var(--gold);
  text-shadow:0 0 35px #e9c46a44;
}

.statusText{
  min-height:20px;
  margin-top:6px;
  color:#75817c;
  font-size:9px;
}

.statusText.win{
  color:var(--green);
}

.statusText.loss{
  color:#ff7884;
}

/* BOARD */

.boardFrame{
  padding:8px;
  border-radius:18px;
  background:
    linear-gradient(145deg,#303835,#080b0b 27%,#1b211f 75%,#070909);
  border:1px solid #3a433f;
  box-shadow:
    0 30px 70px #000,
    inset 0 1px #ffffff15,
    inset 0 -2px #000;
}

.board{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  padding:6px;
  border-radius:13px;
  background:
    radial-gradient(circle at 50% 20%,#17201d,#070909 75%);
  border:1px solid #161d1b;
}

/* TILE */

.tile{
  position:relative;
  aspect-ratio:1;
  min-width:0;
  border-radius:9px;
  border:1px solid #303936;
  background:
    linear-gradient(145deg,#202725,#121817 52%,#0b0f0f);
  box-shadow:
    inset 0 1px #ffffff0b,
    inset 0 -6px 12px #0009,
    0 3px 6px #0009;
  display:grid;
  place-items:center;
  overflow:hidden;
  transition:
    transform .13s,
    background .2s,
    border-color .2s,
    box-shadow .2s;
}

.tile::before{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  top:6%;
  height:38%;
  border-radius:50%;
  background:#ffffff07;
  filter:blur(4px);
  pointer-events:none;
}

.tile:active{
  transform:scale(.91);
}

.tile:not(.open):hover{
  border-color:#496057;
}

.tile.open{
  animation:tileOpen .24s cubic-bezier(.2,.8,.2,1);
}

@keyframes tileOpen{
  0%{
    transform:scale(.75) rotateX(55deg);
    opacity:.35;
  }
  100%{
    transform:scale(1) rotateX(0);
    opacity:1;
  }
}

/* SAFE TILE */

.tile.safe{
  background:
    radial-gradient(circle at 50% 42%,#1d6049,#0c2c21 57%,#06130f);
  border-color:#268262;
  box-shadow:
    inset 0 1px #ffffff12,
    inset 0 -9px 15px #0008,
    0 0 24px #19e39a18;
}

/* DIAMOND */

.diamondSVG{
  width:60%;
  height:60%;
  overflow:visible;
  filter:
    drop-shadow(0 3px 4px #000)
    drop-shadow(0 0 8px #5affc033);
  animation:diamondIn .35s cubic-bezier(.2,.8,.2,1);
}

@keyframes diamondIn{
  0%{
    opacity:0;
    transform:scale(.2) rotate(-15deg);
  }
  60%{
    opacity:1;
    transform:scale(1.15) rotate(3deg);
  }
  100%{
    transform:scale(1) rotate(0);
  }
}

.diamondShine{
  animation:shine 1.3s ease-in-out infinite;
}

@keyframes shine{
  0%,100%{opacity:.35}
  50%{opacity:1}
}

/* BOMB TILE */

.tile.bomb{
  background:
    radial-gradient(circle at 50% 40%,#762d39,#32151b 57%,#15090c);
  border-color:#a43f4d;
  box-shadow:
    inset 0 1px #ffffff0b,
    inset 0 -9px 15px #0009,
    0 0 35px #f04b5d2c;
}

.bombSVG{
  width:61%;
  height:61%;
  overflow:visible;
  filter:
    drop-shadow(0 4px 5px #000)
    drop-shadow(0 0 8px #f04b5d30);
  animation:bombPop .28s cubic-bezier(.2,.8,.2,1);
}

@keyframes bombPop{
  0%{
    transform:scale(.2);
    opacity:0;
  }
  75%{
    transform:scale(1.13);
  }
  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* CONTROLS */

.controls{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}

.field{
  min-width:0;
  padding:10px;
  border-radius:10px;
  border:1px solid #252d2a;
  background:#080b0b;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#75817c;
  font-size:8px;
  letter-spacing:2px;
}

.field input{
  width:100%;
  height:30px;
  border:0;
  outline:0;
  background:none;
  color:white;
  font-size:15px;
  font-weight:900;
}

.quick{
  display:flex;
  gap:5px;
  margin-top:7px;
}

.quick button,
.bombOption{
  flex:1;
  min-width:0;
  height:34px;
  border-radius:7px;
  border:1px solid #2a3330;
  background:#171c1b;
  color:#929c98;
  font-size:8px;
  font-weight:800;
}

.quick button:active,
.bombOption:active{
  transform:scale(.96);
}

.bombOptions{
  display:flex;
  gap:5px;
}

.bombOption.active{
  background:#35171d;
  border-color:#87333f;
  color:#ff8490;
}

/* ACTIONS */

.action{
  width:100%;
  min-height:50px;
  margin-top:9px;
  border:0;
  border-radius:10px;
  background:linear-gradient(180deg,#26eda6,#0fc983);
  color:#03140d;
  font-size:10px;
  font-weight:950;
  letter-spacing:1.1px;
  box-shadow:0 10px 30px #19e39a17;
  transition:.12s;
}

.action:active{
  transform:scale(.985);
}

.action:disabled{
  opacity:.3;
  box-shadow:none;
}

.cash{
  background:linear-gradient(180deg,#efd184,#c69c40);
  color:#171006;
}

.cash.ready{
  animation:cashPulse 1.15s ease-in-out infinite;
  box-shadow:
    0 0 25px #e9c46a30,
    0 8px 30px #0005;
}

@keyframes cashPulse{
  50%{
    filter:brightness(1.09);
  }
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.stat{
  min-width:0;
  padding:10px 7px;
  border-radius:8px;
  background:#090c0c;
  border:1px solid #202725;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:12px;
}

.stat span{
  display:block;
  margin-top:3px;
  color:#66716d;
  font-size:6px;
  letter-spacing:1px;
}

/* HISTORY */

.history{
  display:flex;
  gap:5px;
  overflow-x:auto;
  scrollbar-width:none;
}

.history::-webkit-scrollbar{
  display:none;
}

.historyItem{
  flex:0 0 auto;
  min-width:58px;
  height:32px;
  padding:0 8px;
  display:grid;
  place-items:center;
  border-radius:7px;
  background:#171c1b;
  border:1px solid #272e2c;
  color:#818b87;
  font-size:8px;
  font-weight:850;
}

.historyItem.win{
  color:var(--green);
  background:#0c2b20;
  border-color:#185c44;
}

.historyItem.loss{
  color:#ff7884;
  background:#2b1217;
  border-color:#63252f;
}

/* FLASH */

.resultFlash{
  position:fixed;
  inset:0;
  z-index:200;
  display:grid;
  place-items:center;
  pointer-events:none;
  opacity:0;
}

.resultCard{
  padding:25px 30px;
  border-radius:18px;
  background:#0c1110ee;
  border:1px solid #ffffff18;
  text-align:center;
  box-shadow:0 30px 100px #000;
  transform:scale(.8);
}

.resultTitle{
  font-size:27px;
  font-weight:950;
}

.resultValue{
  margin-top:5px;
  color:var(--green);
  font-size:16px;
  font-weight:900;
}

.resultFlash.show{
  animation:flash .9s ease-out;
}

.resultFlash.show .resultCard{
  animation:resultCard .7s cubic-bezier(.2,.8,.2,1);
}

@keyframes flash{
  0%{opacity:0}
  20%{opacity:1}
  70%{opacity:1}
  100%{opacity:0}
}

@keyframes resultCard{
  0%{
    transform:scale(.65);
    opacity:0;
  }
  45%{
    transform:scale(1.04);
    opacity:1;
  }
  100%{
    transform:scale(1);
  }
}

/* PARTICLES */

.particle{
  position:fixed;
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--green);
  pointer-events:none;
  z-index:300;
  animation:particle .9s ease-out forwards;
}

@keyframes particle{
  0%{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  100%{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

.shake{
  animation:shake .38s ease-out;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-5px)}
  40%{transform:translateX(5px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(3px)}
}

/* TABLET / DESKTOP */

@media(min-width:650px){

  .page{
    padding-top:28px;
  }

  .controls{
    grid-template-columns:1fr 1fr;
  }

  .board{
    gap:8px;
    padding:8px;
  }

  .tile{
    border-radius:10px;
  }

  .diamondSVG,
  .bombSVG{
    width:58%;
    height:58%;
  }
}

/* SMALL PHONES */

@media(max-width:360px){

  .logo{
    letter-spacing:3px;
  }

  .balance{
    min-width:76px;
    font-size:9px;
  }

  .headBtn{
    padding:0 7px;
  }

  .page{
    padding-left:7px;
    padding-right:7px;
  }

  .panel{
    padding:10px;
  }

  .boardFrame{
    padding:5px;
  }

  .board{
    gap:4px;
    padding:4px;
  }

  .tile{
    border-radius:7px;
  }

  .diamondSVG,
  .bombSVG{
    width:63%;
    height:63%;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen" class="loginScreen">

  <div class="login">

    <div class="mark">N</div>

    <div class="brand">NOIRVA</div>

    <div class="tag">
      MINES · VIRTUAL PLAYGROUND
    </div>

    <div class="loginBox">

      <label class="label">
        USERNAME
      </label>

      <input
        id="username"
        class="input"
        type="text"
        autocomplete="username"
        placeholder="Enter username"
      >

      <label class="label">
        PASSWORD
      </label>

      <input
        id="password"
        class="input"
        type="password"
        autocomplete="current-password"
        placeholder="Enter password"
      >

      <button
        class="mainBtn"
        onclick="login()"
      >
        ENTER NOIRVA
      </button>

      <div id="loginError" class="error"></div>

      <div class="note">
        DEMO ACCESS · VIRTUAL COINS ONLY<br>
        NO REAL-MONEY WAGERING OR WITHDRAWALS
      </div>

    </div>

  </div>

</section>


<!-- GAME -->

<section id="gameScreen" class="hidden">

<header class="header">

  <div class="logo">
    NOIRVA
  </div>

  <div class="headerRight">

    <div id="balance" class="balance">
      10,000 ◈
    </div>

    <button
      id="soundBtn"
      class="headBtn"
      onclick="toggleSound()"
    >
      SOUND ON
    </button>

    <button
      class="headBtn"
      onclick="logout()"
    >
      EXIT
    </button>

  </div>

</header>


<main class="page">

  <div class="top">

    <button
      class="back"
      onclick="logout()"
    >
      ← EXIT GAME
    </button>

    <div class="title">
      MINES
    </div>

    <div
      id="miniBalance"
      class="miniBalance"
    >
      10,000 ◈
    </div>

  </div>


  <!-- STATUS -->

  <div class="panel status">

    <div class="statusLabel">
      CURRENT MULTIPLIER
    </div>

    <div
      id="multiplier"
      class="multiplier"
    >
      1.00×
    </div>

    <div
      id="statusText"
      class="statusText"
    >
      Choose your settings and start a round.
    </div>

  </div>


  <!-- BOARD -->

  <div
    id="boardPanel"
    class="panel"
  >

    <div class="boardFrame">

      <div
        id="board"
        class="board"
      ></div>

    </div>

  </div>


  <!-- CONTROLS -->

  <div class="panel">

    <div class="controls">

      <div class="field">

        <label>
          BET
        </label>

        <input
          id="bet"
          type="number"
          min="1"
          value="100"
          inputmode="numeric"
        >

        <div class="quick">

          <button onclick="setBet(50)">
            50
          </button>

          <button onclick="setBet(100)">
            100
          </button>

          <button onclick="setBet(500)">
            500
          </button>

        </div>

      </div>


      <div class="field">

        <label>
          BOMBS
        </label>

        <div class="bombOptions">

          <button
            id="bomb3"
            class="bombOption"
            onclick="setBombs(3)"
          >
            3
          </button>

          <button
            id="bomb5"
            class="bombOption active"
            onclick="setBombs(5)"
          >
            5
          </button>

          <button
            id="bomb8"
            class="bombOption"
            onclick="setBombs(8)"
          >
            8
          </button>

          <button
            id="bomb12"
            class="bombOption"
            onclick="setBombs(12)"
          >
            12
          </button>

        </div>

      </div>

    </div>


    <button
      id="startBtn"
      class="action"
      onclick="startRound()"
    >
      START ROUND
    </button>


    <button
      id="cashBtn"
      class="action cash"
      disabled
      onclick="cashOut()"
    >
      CASH OUT · 0 ◈
    </button>

  </div>


  <!-- STATS -->

  <div class="panel">

    <div class="stats">

      <div class="stat">
        <strong id="safeCount">0</strong>
        <span>SAFE TILES</span>
      </div>

      <div class="stat">
        <strong id="roundBet">0 ◈</strong>
        <span>ROUND BET</span>
      </div>

      <div class="stat">
        <strong id="potential">0 ◈</strong>
        <span>POTENTIAL WIN</span>
      </div>

    </div>

  </div>


  <!-- HISTORY -->

  <div class="panel">

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:9px
    ">

      <strong style="
        font-size:10px;
        letter-spacing:1px
      ">
        RECENT ROUNDS
      </strong>

      <span style="
        font-size:7px;
        color:#65706c
      ">
        VIRTUAL
      </span>

    </div>

    <div
      id="history"
      class="history"
    ></div>

  </div>

</main>

</section>


<!-- RESULT -->

<div
  id="resultFlash"
  class="resultFlash"
>

  <div class="resultCard">

    <div
      id="resultTitle"
      class="resultTitle"
    >
      WIN
    </div>

    <div
      id="resultValue"
      class="resultValue"
    >
      +0 ◈
    </div>

  </div>

</div>


<script>

/* =========================================
   STATE
========================================= */

const state={

  user:localStorage.getItem("noirva_user")||"",

  balance:Number(
    localStorage.getItem("noirva_balance")||10000
  ),

  sound:
    localStorage.getItem("noirva_sound")!=="off",

};


let audioContext=null;


/* =========================================
   MONEY
========================================= */

function money(value){

  return Math.floor(value)
    .toLocaleString()+" ◈";

}


/* =========================================
   SAVE
========================================= */

function save(){

  localStorage.setItem(
    "noirva_balance",
    Math.max(0,state.balance)
  );

  if(state.user){

    localStorage.setItem(
      "noirva_user",
      state.user
    );

  }

}


/* =========================================
   BALANCE
========================================= */

function updateBalance(){

  document.getElementById("balance")
    .textContent=money(state.balance);

  document.getElementById("miniBalance")
    .textContent=money(state.balance);

  save();

}


/* =========================================
   BET
========================================= */

function setBet(value){

  if(state.active)return;

  document.getElementById("bet")
    .value=value;

  uiClick();

}


/* =========================================
   BOMBS
========================================= */

function setBombs(value){

  if(state.active)return;

  state.bombs=value;

  document
    .querySelectorAll(".bombOption")
    .forEach(button=>{
      button.classList.remove("active");
    });

  document
    .getElementById("bomb"+value)
    .classList.add("active");

  uiClick();

}


/* =========================================
   VALID BET
========================================= */

function validBet(){

  const value=Math.floor(
    Number(
      document.getElementById("bet").value
    )
  );

  if(!Number.isFinite(value))return 0;

  if(value<1)return 0;

  if(value>state.balance)return 0;

  return value;

}


/* =========================================
   LOGIN
========================================= */

function login(){

  const username=
    document.getElementById("username")
      .value.trim();

  const password=
    document.getElementById("password")
      .value;

  if(
    username.length<1 ||
    password.length<3
  ){

    document.getElementById("loginError")
      .textContent=
      "Enter a username and 3+ character password.";

    return;

  }

  state.user=username;

  save();

  initAudio();

  document.getElementById("loginScreen")
    .classList.add("hidden");

  document.getElementById("gameScreen")
    .classList.remove("hidden");

  updateBalance();

  buildBoard();

  updateSoundButton();

  renderHistory();

}


/* =========================================
   LOGOUT
========================================= */

function logout(){

  state.active=false;

  document.getElementById("gameScreen")
    .classList.add("hidden");

  document.getElementById("loginScreen")
    .classList.remove("hidden");

}


/* =========================================
   AUDIO ENGINE
========================================= */

function initAudio(){

  try{

    if(!audioContext){

      audioContext=
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(
      audioContext &&
      audioContext.state==="suspended"
    ){

      audioContext.resume();

    }

  }catch(error){}

}


/*
  Richer audio than simple one-note beeps.
  Uses multiple oscillators + envelopes.
*/

function tone(
  frequency,
  duration=.12,
  type="sine",
  volume=.08,
  delay=0
){

  if(!state.sound)return;

  initAudio();

  if(!audioContext)return;

  const now=
    audioContext.currentTime+delay;

  const oscillator=
    audioContext.createOscillator();

  const gain=
    audioContext.createGain();

  oscillator.type=type;

  oscillator.frequency.setValueAtTime(
    frequency,
    now
  );

  gain.gain.setValueAtTime(
    .0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    now+.015
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+duration
  );

  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );

  oscillator.start(now);

  oscillator.stop(
    now+duration+.03
  );

}

/* =========================================
   BUILD BOARD
========================================= */

function buildBoard(){

  const board=
    document.getElementById("board");

  board.innerHTML="";

  state.board=
    Array(25).fill(false);

  let placed=0;

  while(placed<state.bombs){

    const index=
      Math.floor(Math.random()*25);

    if(!state.board[index]){

      state.board[index]=true;

      placed++;

    }

  }


  for(let i=0;i<25;i++){

    const tile=
      document.createElement("button");

    tile.className="tile";

    tile.type="button";

    tile.dataset.index=i;

    tile.innerHTML=
      `<span style="
        font-size:12px;
        color:#56615d;
        font-weight:900;
      ">+</span>`;

    tile.addEventListener(
      "click",
      ()=>{
        revealTile(i,tile);
      }
    );

    board.appendChild(tile);

  }

}


/* =========================================
   START ROUND
========================================= */

function startRound(){

  if(state.active)return;

  const bet=validBet();

  if(!bet){

    showStatus(
      "Invalid bet or insufficient balance.",
      "loss"
    );

    return;

  }


  initAudio();

  state.active=true;

  state.bet=bet;

  state.revealed=0;

  state.multiplier=1;


  state.balance-=bet;

  updateBalance();

  buildBoard();


  document.getElementById("startBtn")
    .disabled=true;

  document.getElementById("cashBtn")
    .disabled=false;

  document.getElementById("cashBtn")
    .classList.remove("ready");

  document.getElementById("cashBtn")
    .textContent=
    "CASH OUT · 0 ◈";


  document.getElementById("roundBet")
    .textContent=money(bet);

  document.getElementById("safeCount")
    .textContent="0";

  document.getElementById("potential")
    .textContent="0 ◈";


  setMultiplier(1);

  showStatus(
    "Find the diamonds.",
    ""
  );

  uiClick();

}


/* =========================================
   REVEAL TILE
========================================= */

function revealTile(index,tile){

  if(!state.active)return;

  if(tile.classList.contains("open"))return;

  tile.classList.add("open");


  /* BOMB */

  if(state.board[index]){

    tile.classList.add("bomb");

    tile.innerHTML=
      bombSVG();

    revealBombs();

    state.active=false;

    document.getElementById("cashBtn")
      .disabled=true;

    bombSound();

    shakeBoard();

    showStatus(
      "BOOM · ROUND LOST",
      "loss"
    );

    addHistory(
      "−"+money(state.bet),
      false
    );

    showResult(
      "BOOM",
      "−"+money(state.bet),
      false
    );

    setTimeout(
      resetAfterRound,
      1100
    );

    return;

  }


  /* SAFE */

  tile.classList.add("safe");

  tile.innerHTML=
    diamondSVG();

  state.revealed++;


  state.multiplier=
    1+
    state.revealed*.15+
    Math.pow(
      state.revealed,
      1.45
    )*.018;


  setMultiplier(
    state.multiplier
  );


  const potential=
    Math.floor(
      state.bet*
      state.multiplier
    );


  document.getElementById("safeCount")
    .textContent=
    state.revealed;


  document.getElementById("potential")
    .textContent=
    money(potential);


  document.getElementById("cashBtn")
    .textContent=
    "CASH OUT · "+
    money(potential);


  document.getElementById("cashBtn")
    .classList.add("ready");


  diamondSound();


  if(
    state.revealed>=
    25-state.bombs
  ){

    cashOut();

  }

}


/* =========================================
   REVEAL BOMBS
========================================= */

function revealBombs(){

  const tiles=
    document.querySelectorAll(".tile");

  tiles.forEach(
    (tile,index)=>{

      if(
        state.board[index] &&
        !tile.classList.contains("open")
      ){

        tile.classList.add(
          "open",
          "bomb"
        );

        tile.innerHTML=
          bombSVG();

      }

    }
  );

}


/* =========================================
   CASH OUT
========================================= */

function cashOut(){

  if(!state.active)return;

  const payout=
    Math.floor(
      state.bet*
      state.multiplier
    );


  state.balance+=payout;

  updateBalance();

  state.active=false;


  document.getElementById("cashBtn")
    .disabled=true;

  document.getElementById("cashBtn")
    .classList.remove("ready");


  showStatus(
    "CASHED OUT · "+money(payout),
    "win"
  );


  addHistory(
    "+"+money(payout),
    true
  );


  cashSound();

  winSound();

  createParticles(32);


  showResult(
    "CASHED OUT",
    "+"+money(payout),
    true
  );


  setTimeout(
    resetAfterRound,
    1100
  );

}


/* =========================================
   RESET
========================================= */

function resetAfterRound(){

  state.active=false;

  state.revealed=0;

  state.multiplier=1;

  state.bet=0;


  buildBoard();


  document.getElementById("startBtn")
    .disabled=false;

  document.getElementById("cashBtn")
    .disabled=true;

  document.getElementById("cashBtn")
    .classList.remove("ready");

  document.getElementById("cashBtn")
    .textContent=
    "CASH OUT · 0 ◈";


  document.getElementById("safeCount")
    .textContent="0";

  document.getElementById("roundBet")
    .textContent="0 ◈";

  document.getElementById("potential")
    .textContent="0 ◈";


  setMultiplier(1);


  showStatus(
    "Choose your settings and start a round.",
    ""
  );

}


/* =========================================
   MULTIPLIER
========================================= */

function setMultiplier(value){

  const element=
    document.getElementById("multiplier");

  element.textContent=
    value.toFixed(2)+"×";


  if(value>=2.5){

    element.classList.add("hot");

  }else{

    element.classList.remove("hot");

  }

}


/* =========================================
   STATUS
========================================= */

function showStatus(text,type){

  const element=
    document.getElementById("statusText");

  element.textContent=text;

  element.className=
    "statusText "+
    (
      type==="win"
        ?"win"
        :
      type==="loss"
        ?"loss"
        :""
    );

}


/* =========================================
   HISTORY
========================================= */

function addHistory(text,isWin){

  state.history.unshift({
    text,
    isWin
  });

  state.history=
    state.history.slice(0,10);

  renderHistory();

}


function renderHistory(){

  const element=
    document.getElementById("history");


  if(!state.history.length){

    element.innerHTML=
      `<div class="historyItem">
        NO ROUNDS
      </div>`;

    return;

  }


  element.innerHTML=
    state.history
      .map(item=>`

        <div class="
          historyItem
          ${item.isWin?"win":"loss"}
        ">
          ${item.text}
        </div>

      `)
      .join("");

}


/* =========================================
   RESULT
========================================= */

function showResult(
  title,
  value,
  win
){

  const flash=
    document.getElementById(
      "resultFlash"
    );


  document.getElementById(
    "resultTitle"
  ).textContent=title;


  const valueElement=
    document.getElementById(
      "resultValue"
    );


  valueElement.textContent=value;


  valueElement.style.color=
    win
      ?"var(--green)"
      :"var(--red)";


  flash.classList.remove("show");

  void flash.offsetWidth;

  flash.classList.add("show");

}


/* =========================================
   SHAKE
========================================= */

function shakeBoard(){

  const panel=
    document.getElementById(
      "boardPanel"
    );

  panel.classList.remove("shake");

  void panel.offsetWidth;

  panel.classList.add("shake");

}


/* =========================================
   PARTICLES
========================================= */

function createParticles(count){

  for(
    let i=0;
    i<count;
    i++
  ){

    const particle=
      document.createElement("div");

    particle.className="particle";


    particle.style.left=
      (
        50+
        Math.random()*14-
        7
      )+"vw";


    particle.style.top=
      (
        45+
        Math.random()*12-
        6
      )+"vh";


    particle.style.setProperty(
      "--x",
      (
        Math.random()*400-
        200
      )+"px"
    );


    particle.style.setProperty(
      "--y",
      (
        -80-
        Math.random()*350
      )+"px"
    );


    document.body.appendChild(
      particle
    );


    setTimeout(
      ()=>{
        particle.remove();
      },
      1000
    );

  }

}


/* =========================================
   ENTER KEY LOGIN
========================================= */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    event=>{

      if(event.key==="Enter"){
        login();
      }

    }
  );


/* =========================================
   INITIALIZE
========================================= */

updateSoundButton();

if(state.user){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("gameScreen")
    .classList.remove("hidden");

  updateBalance();

  buildBoard();

}else{

  document
    .getElementById("gameScreen")
    .classList.add("hidden");

}

renderHistory();

</script>
