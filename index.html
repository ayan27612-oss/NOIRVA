<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050707">
<title>NOIRVA MINES</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#050707;
  --bg2:#090c0c;
  --panel:#0d1111;
  --panel2:#121717;
  --line:#222a28;
  --text:#f4f7f5;
  --muted:#74807c;
  --green:#19e39a;
  --green2:#0c8d60;
  --red:#f04b5d;
  --gold:#e9c46a;
  --cyan:#64d8ff;
}

html,body{
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
}

.hidden{
  display:none!important;
}

/* =========================================================
   BACKGROUND
========================================================= */

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% -10%,#153e3025,transparent 35%),
    radial-gradient(circle at 10% 80%,#0b42321a,transparent 25%),
    #050707;
  z-index:-2;
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.035;
  background-image:
    linear-gradient(#fff 1px,transparent 1px),
    linear-gradient(90deg,#fff 1px,transparent 1px);
  background-size:80px 80px;
  z-index:-1;
}

/* =========================================================
   LOGIN
========================================================= */

.loginScreen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:22px;
}

.login{
  width:min(390px,100%);
  text-align:center;
}

.mark{
  width:66px;
  height:66px;
  margin:auto auto 19px;
  border-radius:18px;
  display:grid;
  place-items:center;
  border:1px solid #ffffff20;
  background:
    radial-gradient(circle at 35% 25%,#24332e,#0d1211 65%);
  box-shadow:
    0 20px 70px #000,
    inset 0 1px #ffffff15;
  font-size:28px;
  font-weight:950;
  letter-spacing:-2px;
}

.brand{
  font-size:29px;
  font-weight:950;
  letter-spacing:8px;
}

.tag{
  margin-top:8px;
  color:#68736f;
  font-size:8px;
  letter-spacing:3px;
}

.loginBox{
  margin-top:34px;
  padding:23px;
  background:#0d1110e8;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 30px 100px #000b;
}

.label{
  display:block;
  margin-bottom:8px;
  text-align:left;
  color:#75807b;
  font-size:8px;
  letter-spacing:2px;
}

.input{
  width:100%;
  height:49px;
  margin-bottom:16px;
  padding:0 14px;
  border-radius:9px;
  outline:none;
  border:1px solid #242c29;
  background:#070a0a;
  color:white;
}

.input:focus{
  border-color:#19e39a66;
  box-shadow:0 0 0 3px #19e39a0b;
}

.mainBtn{
  width:100%;
  height:50px;
  border:0;
  border-radius:9px;
  background:linear-gradient(180deg,#24eca4,#10ca83);
  color:#03150e;
  font-weight:950;
  letter-spacing:1px;
  box-shadow:0 10px 30px #19e39a1c;
}

.error{
  min-height:18px;
  margin-top:9px;
  color:var(--red);
  font-size:10px;
}

.note{
  margin-top:14px;
  color:#59635f;
  font-size:8px;
  line-height:1.7;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  height:64px;
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#070909e8;
  backdrop-filter:blur(20px);
  border-bottom:1px solid #202725;
}

.logo{
  font-size:14px;
  font-weight:950;
  letter-spacing:4px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:7px;
}

.balance{
  min-width:92px;
  padding:9px 10px;
  border-radius:8px;
  border:1px solid #234336;
  background:#0b1712;
  color:var(--green);
  font-size:10px;
  font-weight:900;
  text-align:center;
}

.headBtn{
  height:36px;
  padding:0 9px;
  border-radius:8px;
  border:1px solid #242a29;
  background:#111515;
  color:#8b9490;
  font-size:8px;
}

/* =========================================================
   GAME PAGE
========================================================= */

.page{
  width:min(900px,100%);
  margin:auto;
  padding:17px 13px 60px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.back{
  background:none;
  border:0;
  color:#7e8985;
  font-size:10px;
}

.title{
  font-size:17px;
  font-weight:950;
  letter-spacing:.5px;
}

.miniBalance{
  color:var(--green);
  font-size:10px;
  font-weight:900;
}

.panel{
  margin-bottom:10px;
  padding:14px;
  border-radius:16px;
  background:
    linear-gradient(145deg,#101515,#0b0f0f);
  border:1px solid var(--line);
  box-shadow:
    0 18px 55px #0005,
    inset 0 1px #ffffff04;
}

/* =========================================================
   STATUS DISPLAY
========================================================= */

.status{
  text-align:center;
  padding:4px 0 10px;
}

.statusLabel{
  color:#68736f;
  font-size:8px;
  letter-spacing:2px;
}

.multiplier{
  margin-top:4px;
  font-size:39px;
  font-weight:950;
  letter-spacing:-2px;
  color:var(--green);
  text-shadow:0 0 30px #19e39a24;
  transition:.2s;
}

.multiplier.hot{
  color:var(--gold);
  text-shadow:0 0 35px #e9c46a44;
}

.statusText{
  min-height:20px;
  margin-top:3px;
  color:#75807c;
  font-size:9px;
}

/* =========================================================
   MINE BOARD
========================================================= */

.boardFrame{
  padding:9px;
  border-radius:18px;
  background:
    linear-gradient(145deg,#252c2a,#090c0c 25%,#181e1c 75%,#070909);
  border:1px solid #3a413e;
  box-shadow:
    0 30px 70px #000,
    inset 0 1px #ffffff15,
    inset 0 -2px #000;
}

.board{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  padding:7px;
  border-radius:13px;
  background:
    radial-gradient(circle at 50% 30%,#111918,#070909 75%);
  border:1px solid #161d1b;
}

.tile{
  position:relative;
  aspect-ratio:1;
  min-width:0;
  border-radius:9px;
  border:1px solid #2b3431;
  background:
    linear-gradient(145deg,#1c2321,#101514 55%,#0c1010);
  box-shadow:
    inset 0 1px #ffffff0a,
    inset 0 -5px 10px #0007,
    0 2px 5px #0008;
  display:grid;
  place-items:center;
  overflow:hidden;
  transform:translateZ(0);
  transition:
    transform .15s,
    background .2s,
    border-color .2s,
    box-shadow .2s;
}

.tile:before{
  content:"";
  position:absolute;
  left:10%;
  right:10%;
  top:8%;
  height:35%;
  border-radius:50%;
  background:#ffffff06;
  filter:blur(3px);
  pointer-events:none;
}

.tile:not(.open):active{
  transform:scale(.91);
}

.tile:not(.open):hover{
  border-color:#3f5750;
  box-shadow:
    inset 0 1px #ffffff0d,
    0 0 20px #19e39a0c;
}

.tile.open{
  animation:tileOpen .24s ease-out;
}

@keyframes tileOpen{
  0%{
    transform:scale(.7) rotateX(60deg);
    opacity:.5;
  }
  100%{
    transform:scale(1) rotateX(0);
    opacity:1;
  }
}

.tile.safe{
  background:
    radial-gradient(circle at 50% 40%,#164f3b,#0a241b 60%,#07130f);
  border-color:#1d7355;
  box-shadow:
    inset 0 1px #ffffff0b,
    inset 0 -8px 15px #0007,
    0 0 20px #19e39a16;
}

.tile.bomb{
  background:
    radial-gradient(circle at 50% 40%,#702936,#32141b 60%,#16090c);
  border-color:#9c3a49;
  box-shadow:
    inset 0 1px #ffffff0b,
    0 0 30px #f04b5d22;
}

.tileContent{
  position:relative;
  z-index:2;
  font-size:23px;
  filter:drop-shadow(0 3px 5px #000);
}

.diamond{
  color:#d8fff0;
  text-shadow:
    0 0 8px #19e39a,
    0 0 22px #19e39a88;
  animation:diamondPulse 1.3s infinite alternate;
}

@keyframes diamondPulse{
  to{
    transform:scale(1.09) rotate(4deg);
    filter:drop-shadow(0 0 8px #19e39a);
  }
}

.mineIcon{
  font-size:21px;
  animation:minePop .25s ease-out;
}

@keyframes minePop{
  0%{transform:scale(.2);opacity:0}
  80%{transform:scale(1.15)}
  100%{transform:scale(1);opacity:1}
}

/* =========================================================
   CONTROLS
========================================================= */

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.field{
  min-width:0;
  padding:10px;
  border-radius:9px;
  border:1px solid #242b29;
  background:#080b0b;
}

.field label{
  margin-bottom:6px;
}

.field input{
  width:100%;
  border:0;
  outline:0;
  background:none;
  color:white;
  font-size:14px;
  font-weight:900;
}

.quick{
  display:flex;
  gap:5px;
  margin-top:7px;
}

.quick button{
  flex:1;
  min-width:0;
  height:30px;
  border:1px solid #29312e;
  border-radius:6px;
  background:#171c1b;
  color:#909995;
  font-size:8px;
}

.quick button.active{
  background:#103b2c;
  color:var(--green);
  border-color:#1b7453;
}

.action{
  width:100%;
  height:48px;
  margin-top:9px;
  border:0;
  border-radius:9px;
  background:linear-gradient(180deg,#23eca4,#0fc983);
  color:#03140d;
  font-size:10px;
  font-weight:950;
  letter-spacing:1.2px;
  box-shadow:0 10px 30px #19e39a15;
  transition:.15s;
}

.action:active{
  transform:scale(.985);
}

.action:disabled{
  opacity:.35;
  box-shadow:none;
}

.cash{
  background:linear-gradient(180deg,#eacb7c,#c79d3e);
  color:#171006;
}

.cash.ready{
  box-shadow:0 0 30px #e9c46a2c;
  animation:cashPulse 1.1s infinite;
}

@keyframes cashPulse{
  50%{filter:brightness(1.08)}
}

.bombOptions{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.bombOption{
  flex:1;
  height:31px;
  border-radius:6px;
  border:1px solid #29312e;
  background:#171c1b;
  color:#8e9894;
  font-size:8px;
  font-weight:800;
}

.bombOption.active{
  background:#34161c;
  border-color:#80303c;
  color:#ff8490;
}

/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.stat{
  padding:10px;
  border-radius:8px;
  background:#090c0c;
  border:1px solid #202725;
}

.stat strong{
  display:block;
  font-size:13px;
}

.stat span{
  display:block;
  margin-top:2px;
  color:#66706d;
  font-size:7px;
  letter-spacing:1px;
}

/* =========================================================
   HISTORY
========================================================= */

.history{
  display:flex;
  gap:5px;
  overflow-x:auto;
  scrollbar-width:none;
}

.history::-webkit-scrollbar{
  display:none;
}

.historyItem{
  flex:0 0 auto;
  min-width:55px;
  height:31px;
  padding:0 8px;
  border-radius:6px;
  display:grid;
  place-items:center;
  background:#171c1b;
  color:#818b87;
  border:1px solid #272e2c;
  font-size:8px;
  font-weight:850;
}

.historyItem.win{
  color:var(--green);
  background:#0c2b20;
  border-color:#185c44;
}

.historyItem.loss{
  color:#ff7884;
  background:#2b1217;
  border-color:#63252f;
}

/* =========================================================
   RESULT OVERLAY
========================================================= */

.resultFlash{
  position:fixed;
  inset:0;
  z-index:200;
  display:grid;
  place-items:center;
  pointer-events:none;
  opacity:0;
}

.resultCard{
  padding:25px 30px;
  border-radius:18px;
  background:#0c1110ee;
  border:1px solid #ffffff18;
  text-align:center;
  box-shadow:0 30px 100px #000;
  transform:scale(.8);
}

.resultTitle{
  font-size:27px;
  font-weight:950;
}

.resultValue{
  margin-top:5px;
  color:var(--green);
  font-size:16px;
  font-weight:900;
}

.resultFlash.show{
  animation:flash .9s ease-out;
}

.resultFlash.show .resultCard{
  animation:resultCard .7s cubic-bezier(.2,.8,.2,1);
}

@keyframes flash{
  0%{opacity:0}
  20%{opacity:1}
  70%{opacity:1}
  100%{opacity:0}
}

@keyframes resultCard{
  0%{transform:scale(.65);opacity:0}
  45%{transform:scale(1.04);opacity:1}
  100%{transform:scale(1)}
}

/* =========================================================
   PARTICLES
========================================================= */

.particle{
  position:fixed;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  pointer-events:none;
  z-index:300;
  animation:particle .9s ease-out forwards;
}

@keyframes particle{
  0%{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  100%{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

/* =========================================================
   SHAKE
========================================================= */

.shake{
  animation:shake .38s ease-out;
}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-5px)}
  40%{transform:translateX(5px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(3px)}
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(min-width:650px){

  .controls{
    grid-template-columns:1fr 1fr 1fr;
  }

  .page{
    padding-top:28px;
  }

  .board{
    gap:8px;
  }

  .tileContent{
    font-size:28px;
  }
}

@media(max-width:390px){

  .header{
    padding:0 10px;
  }

  .logo{
    letter-spacing:3px;
  }

  .balance{
    min-width:78px;
    font-size:9px;
  }

  .headBtn{
    padding:0 7px;
  }

  .page{
    padding-left:9px;
    padding-right:9px;
  }

  .panel{
    padding:11px;
  }

  .boardFrame{
    padding:6px;
  }

  .board{
    gap:4px;
    padding:5px;
  }

  .tile{
    border-radius:7px;
  }

  .tileContent{
    font-size:18px;
  }
}
</style>
</head>

<body>

<!-- =======================================================
LOGIN
======================================================= -->

<section id="loginScreen" class="loginScreen">

<div class="login">

<div class="mark">N</div>

<div class="brand">NOIRVA</div>
<div class="tag">MINES · VIRTUAL PLAYGROUND</div>

<div class="loginBox">

<label class="label">USERNAME</label>
<input
  id="username"
  class="input"
  type="text"
  autocomplete="username"
  placeholder="Enter username">

<label class="label">PASSWORD</label>
<input
  id="password"
  class="input"
  type="password"
  autocomplete="current-password"
  placeholder="Enter password">

<button class="mainBtn" onclick="login()">
ENTER NOIRVA
</button>

<div id="loginError" class="error"></div>

<div class="note">
DEMO ACCESS · VIRTUAL COINS ONLY<br>
NO REAL-MONEY WAGERING OR WITHDRAWALS
</div>

</div>
</div>
</section>


<!-- =======================================================
GAME
======================================================= -->

<section id="gameScreen" class="hidden">

<header class="header">

<div class="logo">NOIRVA</div>

<div class="headerRight">

<div id="balance" class="balance">
10,000 ◈
</div>

<button
  id="soundBtn"
  class="headBtn"
  onclick="toggleSound()">
SOUND ON
</button>

<button
  class="headBtn"
  onclick="logout()">
EXIT
</button>

</div>
</header>


<main class="page">

<div class="top">

<button class="back" onclick="logout()">
← EXIT GAME
</button>

<div class="title">
MINES
</div>

<div id="miniBalance" class="miniBalance">
10,000 ◈
</div>

</div>


<!-- STATUS -->

<div class="panel status">

<div class="statusLabel">
CURRENT MULTIPLIER
</div>

<div id="multiplier" class="multiplier">
1.00×
</div>

<div id="statusText" class="statusText">
Choose your settings and start a round.
</div>

</div>


<!-- BOARD -->

<div id="boardPanel" class="panel">

<div class="boardFrame">

<div id="board" class="board"></div>

</div>

</div>


<!-- CONTROLS -->

<div class="panel">

<div class="controls">

<div class="field">

<label>BET</label>

<input
  id="bet"
  type="number"
  min="1"
  value="100">

<div class="quick">

<button onclick="setBet(50)">50</button>
<button onclick="setBet(100)">100</button>
<button onclick="setBet(500)">500</button>

</div>

</div>


<div class="field">

<label>BOMBS</label>

<div class="bombOptions">

<button
  id="bomb3"
  class="bombOption"
  onclick="setBombs(3)">
3
</button>

<button
  id="bomb5"
  class="bombOption active"
  onclick="setBombs(5)">
5
</button>

<button
  id="bomb8"
  class="bombOption"
  onclick="setBombs(8)">
8
</button>

<button
  id="bomb12"
  class="bombOption"
  onclick="setBombs(12)">
12
</button>

</div>

</div>

</div>


<button
  id="startBtn"
  class="action"
  onclick="startRound()">
START ROUND
</button>


<button
  id="cashBtn"
  class="action cash"
  disabled
  onclick="cashOut()">
CASH OUT · 0 ◈
</button>

</div>


<!-- STATS -->

<div class="panel">

<div class="stats">

<div class="stat">
<strong id="safeCount">0</strong>
<span>SAFE TILES</span>
</div>

<div class="stat">
<strong id="roundBet">0 ◈</strong>
<span>ROUND BET</span>
</div>

<div class="stat">
<strong id="potential">0 ◈</strong>
<span>POTENTIAL WIN</span>
</div>

</div>

</div>


<!-- HISTORY -->

<div class="panel">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:9px;
">

<strong style="
font-size:10px;
letter-spacing:1px;
">
RECENT ROUNDS
</strong>

<span style="
font-size:7px;
color:#65706c;
">
VIRTUAL
</span>

</div>

<div id="history" class="history"></div>

</div>

</main>

</section>


<!-- RESULT -->

<div id="resultFlash" class="resultFlash">

<div class="resultCard">

<div id="resultTitle" class="resultTitle">
WIN
</div>

<div id="resultValue" class="resultValue">
+0 ◈
</div>

</div>

</div>


<script>

/* =========================================================
   NOIRVA MINES ENGINE
========================================================= */

const state = {

  user:
    localStorage.getItem("noirva_user") || "",

  balance:
    Number(localStorage.getItem("noirva_balance") || 10000),

  sound:
    localStorage.getItem("noirva_sound") !== "off",

  bombs:5,

  active:false,

  bet:0,

  revealed:0,

  multiplier:1,

  board:[],

  history:[]

};


let audioContext = null;


/* =========================================================
   BASIC HELPERS
========================================================= */

function money(value){

  return Math.floor(value).toLocaleString() + " ◈";

}


function save(){

  localStorage.setItem(
    "noirva_balance",
    Math.max(0,state.balance)
  );

  if(state.user){

    localStorage.setItem(
      "noirva_user",
      state.user
    );

  }

}


function updateBalance(){

  document.getElementById("balance").textContent =
    money(state.balance);

  document.getElementById("miniBalance").textContent =
    money(state.balance);

  save();

}


function setBet(value){

  document.getElementById("bet").value = value;

  clickSound();

}


function setBombs(value){

  if(state.active)return;

  state.bombs=value;

  document
    .querySelectorAll(".bombOption")
    .forEach(button=>{
      button.classList.remove("active");
    });

  const button =
    document.getElementById("bomb"+value);

  if(button){
    button.classList.add("active");
  }

  clickSound();

}


function validBet(){

  const value =
    Math.floor(
      Number(
        document.getElementById("bet").value
      )
    );

  if(!Number.isFinite(value))return 0;

  if(value < 1)return 0;

  if(value > state.balance)return 0;

  return value;

}


/* =========================================================
   LOGIN
========================================================= */

function login(){

  const username =
    document.getElementById("username")
      .value
      .trim();

  const password =
    document.getElementById("password").value;

  if(
    username.length < 1 ||
    password.length < 3
  ){

    document.getElementById("loginError")
      .textContent =
      "Enter a username and 3+ character password.";

    return;

  }

  state.user=username;

  save();

  initAudio();

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("gameScreen")
    .classList.remove("hidden");

  updateBalance();

  buildBoard();

  updateSoundButton();

}


function logout(){

  state.active=false;

  document
    .getElementById("gameScreen")
    .classList.add("hidden");

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

}


/* =========================================================
   AUDIO
========================================================= */

function initAudio(){

  try{

    if(!audioContext){

      audioContext =
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(
      audioContext &&
      audioContext.state === "suspended"
    ){

      audioContext.resume();

    }

  }catch(error){}

}


function playTone(
  frequency,
  duration=.08,
  type="sine",
  volume=.07
){

  if(!state.sound)return;

  initAudio();

  if(!audioContext)return;

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type=type;

  oscillator.frequency.setValueAtTime(
    frequency,
    audioContext.currentTime
  );

  gain.gain.setValueAtTime(
    volume,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime + duration
  );

  oscillator.connect(gain);

  gain.connect(audioContext.destination);

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime + duration
  );

}


function clickSound(){

  playTone(
    420,
    .045,
    "square",
    .035
  );

}


function safeSound(){

  playTone(
    620,
    .07,
    "sine",
    .06
  );

  setTimeout(()=>{
    playTone(
      880,
      .1,
      "sine",
      .055
    );
  },60);

}


function bombSound(){

  playTone(
    180,
    .18,
    "sawtooth",
    .09
  );

  setTimeout(()=>{
    playTone(
      95,
      .28,
      "square",
      .08
    );
  },100);

}


function cashSound(){

  playTone(
    500,
    .08,
    "sine",
    .075
  );

  setTimeout(()=>{
    playTone(
      700,
      .09,
      "sine",
      .08
    );
  },90);

  setTimeout(()=>{
    playTone(
      980,
      .16,
      "sine",
      .09
    );
  },190);

}


function updateSoundButton(){

  document.getElementById("soundBtn")
    .textContent =
    state.sound
      ? "SOUND ON"
      : "SOUND OFF";

}


function toggleSound(){

  state.sound=!state.sound;

  localStorage.setItem(
    "noirva_sound",
    state.sound
      ? "on"
      : "off"
  );

  updateSoundButton();

  if(state.sound){

    initAudio();

    clickSound();

  }

}


/* =========================================================
   BOARD
========================================================= */

function buildBoard(){

  const board =
    document.getElementById("board");

  board.innerHTML="";

  state.board =
    Array(25).fill(false);

  let placed=0;

  while(placed < state.bombs){

    const index =
      Math.floor(
        Math.random()*25
      );

    if(!state.board[index]){

      state.board[index]=true;

      placed++;

    }

  }


  for(let i=0;i<25;i++){

    const tile =
      document.createElement("button");

    tile.className="tile";

    tile.type="button";

    tile.dataset.index=i;

    tile.innerHTML =
      `<span class="tileContent">?</span>`;

    tile.addEventListener(
      "click",
      ()=>revealTile(i,tile)
    );

    board.appendChild(tile);

  }

}


/* =========================================================
   ROUND START
========================================================= */

function startRound(){

  if(state.active)return;

  const bet=validBet();

  if(!bet){

    showStatus(
      "Invalid bet or insufficient balance.",
      "loss"
    );

    return;

  }

  initAudio();

  state.active=true;

  state.bet=bet;

  state.revealed=0;

  state.multiplier=1;

  state.balance-=bet;

  updateBalance();

  buildBoard();

  document
    .getElementById("startBtn")
    .disabled=true;

  document
    .getElementById("cashBtn")
    .disabled=false;

  document
    .getElementById("cashBtn")
    .classList.remove("ready");

  document
    .getElementById("cashBtn")
    .textContent =
    "CASH OUT · 0 ◈";

  document
    .getElementById("roundBet")
    .textContent =
    money(bet);

  document
    .getElementById("safeCount")
    .textContent="0";

  document
    .getElementById("potential")
    .textContent="0 ◈";

  setMultiplier(1);

  showStatus(
    "Find the diamonds.",
    ""
  );

  clickSound();

}


/* =========================================================
   REVEAL TILE
========================================================= */

function revealTile(index,tile){

  if(!state.active)return;

  if(tile.classList.contains("open"))return;

  tile.classList.add("open");

  if(state.board[index]){

    tile.classList.add("bomb");

    tile.innerHTML =
      `<span class="tileContent mineIcon">💣</span>`;

    revealBombs();

    state.active=false;

    document
      .getElementById("cashBtn")
      .disabled=true;

    bombSound();

    shakeBoard();

    showStatus(
      "BOOM · ROUND LOST",
      "loss"
    );

    addHistory(
      "−"+money(state.bet),
      false
    );

    showResult(
      "BOOM",
      "−"+money(state.bet),
      false
    );

    setTimeout(
      resetAfterRound,
      1100
    );

    return;

  }


  tile.classList.add("safe");

  tile.innerHTML =
    `<span class="tileContent diamond">◆</span>`;

  state.revealed++;

  /*
    A smooth progressive multiplier.
    More safe tiles = higher potential.
  */

  state.multiplier =
    1 +
    state.revealed*.15 +
    Math.pow(
      state.revealed,
      1.45
    )*.018;

  setMultiplier(
    state.multiplier
  );

  const potential =
    Math.floor(
      state.bet *
      state.multiplier
    );

  document
    .getElementById("safeCount")
    .textContent =
    state.revealed;

  document
    .getElementById("potential")
    .textContent =
    money(potential);

  document
    .getElementById("cashBtn")
    .textContent =
    "CASH OUT · "+money(potential);

  document
    .getElementById("cashBtn")
    .classList.add("ready");

  safeSound();

  /*
    If every non-bomb tile is safe,
    automatically complete the round.
  */

  if(
    state.revealed >=
    25-state.bombs
  ){

    cashOut();

  }

}


/* =========================================================
   REVEAL BOMBS
========================================================= */

function revealBombs(){

  const tiles =
    document.querySelectorAll(".tile");

  tiles.forEach(
    (tile,index)=>{

      if(
        state.board[index] &&
        !tile.classList.contains("open")
      ){

        tile.classList.add(
          "open",
          "bomb"
        );

        tile.innerHTML =
          `<span class="tileContent mineIcon">💣</span>`;

      }

    }
  );

}


/* =========================================================
   CASH OUT
========================================================= */

function cashOut(){

  if(!state.active)return;

  const payout =
    Math.floor(
      state.bet *
      state.multiplier
    );

  state.balance+=payout;

  updateBalance();

  state.active=false;

  document
    .getElementById("cashBtn")
    .disabled=true;

  document
    .getElementById("cashBtn")
    .classList.remove("ready");

  showStatus(
    "CASHED OUT · "+money(payout),
    "win"
  );

  addHistory(
    "+"+money(payout),
    true
  );

  cashSound();

  createParticles(28);

  showResult(
    "CASHED OUT",
    "+"+money(payout),
    true
  );

  setTimeout(
    resetAfterRound,
    1100
  );

}


/* =========================================================
   RESET
========================================================= */

function resetAfterRound(){

  state.active=false;

  state.revealed=0;

  state.multiplier=1;

  state.bet=0;

  buildBoard();

  document
    .getElementById("startBtn")
    .disabled=false;

  document
    .getElementById("cashBtn")
    .disabled=true;

  document
    .getElementById("cashBtn")
    .classList.remove("ready");

  document
    .getElementById("cashBtn")
    .textContent =
    "CASH OUT · 0 ◈";

  document
    .getElementById("safeCount")
    .textContent="0";

  document
    .getElementById("roundBet")
    .textContent="0 ◈";

  document
    .getElementById("potential")
    .textContent="0 ◈";

  setMultiplier(1);

  showStatus(
    "Choose your settings and start a round.",
    ""
  );

}


/* =========================================================
   MULTIPLIER
========================================================= */

function setMultiplier(value){

  const element =
    document.getElementById("multiplier");

  element.textContent =
    value.toFixed(2)+"×";

  if(value>=2.5){

    element.classList.add("hot");

  }else{

    element.classList.remove("hot");

  }

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(text,type){

  const element =
    document.getElementById("statusText");

  element.textContent=text;

  element.className =
    "statusText "+
    (
      type==="win"
        ?"win"
        :
      type==="loss"
        ?"loss"
        :""
    );

}


/* =========================================================
   HISTORY
========================================================= */

function addHistory(text,isWin){

  state.history.unshift({
    text,
    isWin
  });

  state.history =
    state.history.slice(
      0,
      10
    );

  renderHistory();

}


function renderHistory(){

  const element =
    document.getElementById("history");

  if(!state.history.length){

    element.innerHTML =
      `<div class="historyItem">
        NO ROUNDS
      </div>`;

    return;

  }

  element.innerHTML =
    state.history
      .map(item=>`

        <div class="historyItem ${
          item.isWin
            ?"win"
            :"loss"
        }">

          ${item.text}

        </div>

      `)
      .join("");

}


/* =========================================================
   RESULT FLASH
========================================================= */

function showResult(
  title,
  value,
  win
){

  const flash =
    document.getElementById(
      "resultFlash"
    );

  document.getElementById(
    "resultTitle"
  ).textContent=title;

  const valueElement =
    document.getElementById(
      "resultValue"
    );

  valueElement.textContent=value;

  valueElement.style.color =
    win
      ? "var(--green)"
      : "var(--red)";

  flash.classList.remove("show");

  /*
    Force browser to restart animation.
  */

  void flash.offsetWidth;

  flash.classList.add("show");

}


/* =========================================================
   BOARD SHAKE
========================================================= */

function shakeBoard(){

  const panel =
    document.getElementById(
      "boardPanel"
    );

  panel.classList.remove("shake");

  void panel.offsetWidth;

  panel.classList.add("shake");

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(count){

  for(
    let i=0;
    i<count;
    i++
  ){

    const particle =
      document.createElement(
        "div"
      );

    particle.className="particle";

    particle.style.left =
      (
        50 +
        Math.random()*12 -
        6
      )+"vw";

    particle.style.top =
      (
        45 +
        Math.random()*10 -
        5
      )+"vh";

    particle.style.setProperty(
      "--x",
      (
        Math.random()*360-180
      )+"px"
    );

    particle.style.setProperty(
      "--y",
      (
        -60 -
        Math.random()*340
      )+"px"
    );

    document.body.appendChild(
      particle
    );

    setTimeout(
      ()=>particle.remove(),
      1000
    );

  }

}


/* =========================================================
   STARTUP
========================================================= */

updateSoundButton();

if(state.user){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("gameScreen")
    .classList.remove("hidden");

  updateBalance();

  buildBoard();

}else{

  document
    .getElementById("gameScreen")
    .classList.add("hidden");

}

renderHistory();

</script>

</body>
</html>
